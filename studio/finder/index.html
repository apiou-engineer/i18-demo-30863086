<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · 選擇你的組合</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#f4f3f0; --soft:rgba(244,243,240,.6); --line:rgba(244,243,240,.16);
    --card:rgba(255,255,255,.06); --hot:#e9b04a;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:#0a0a0b;-webkit-font-smoothing:antialiased;min-height:100%}
  body.light{--ink:#1b1b1e;--soft:rgba(27,27,30,.66);--line:rgba(27,27,30,.14);--card:rgba(255,255,255,.6)}

  .hd{display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:clamp(38px,7vh,74px) 22px clamp(8px,2vh,16px)}
  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
  .thumb{height:clamp(120px,22vh,220px);width:auto;margin:clamp(14px,3vh,26px) 0;
    filter:drop-shadow(0 22px 34px rgba(0,0,0,.4))}
  .hd h1{font-weight:600;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.03em;line-height:1.02}
  .hd p{margin-top:10px;color:var(--soft);font-size:clamp(.9rem,1.4vw,1.05rem);font-weight:300}

  .cards{max-width:520px;margin:0 auto;padding:clamp(14px,3vh,26px) 18px calc(env(safe-area-inset-bottom,0px) + 56px);
    display:flex;flex-direction:column;gap:12px}
  .card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    transition:transform .35s var(--spring),border-color .3s,background .3s}
  .card:hover{transform:translateY(-3px);border-color:var(--ink)}
  .card:active{transform:scale(.99)}
  .card .info{flex:1;min-width:0}
  .card .nm{font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
  .card .it{font-size:.78rem;color:var(--soft);margin-top:4px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .pr{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .card .now{font-family:var(--mono);font-weight:700;font-size:1.06rem}
  .card .was{font-size:.7rem;color:var(--soft);text-decoration:line-through}
  .card .off{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:var(--hot);
    border:1px solid color-mix(in srgb,var(--hot) 55%,transparent);border-radius:100px;padding:2px 7px;margin-top:2px}
  .card .arr{color:var(--soft);font-size:1.1rem;flex:0 0 auto}

  .back{display:block;text-align:center;margin-top:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--soft);text-decoration:none}

  .veil{position:fixed;inset:0;z-index:40;background:#0a0a0b;pointer-events:none;opacity:1;transition:opacity .5s var(--ease)}
  .veil.gone{opacity:0}
</style>
</head>
<body>
  <div class="hd">
    <div class="eyebrow" id="eyebrow">APIOU &middot; iPhone 18</div>
    <img class="thumb" id="thumb" src="../color/titanium-natural.png" alt="iPhone 18">
    <h1>選擇你的組合</h1>
    <p>挑一個最適合你的,看看早鳥價。</p>
  </div>
  <div class="cards" id="cards"></div>
  <div class="veil" id="veil"></div>

<script>
(function(){
  var MODELS={
    base:{ nm:"iPhone 18", colors:[
      {id:"white", nm:"白色",   img:"../color/titanium-natural.png", base:[228,227,224], bloom:[40,40,44], neg:true},
      {id:"black", nm:"黑色",   img:"../color/titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"群青色", img:"../color/titanium-blue.png",    base:[10,16,34],    bloom:[120,150,235]},
      {id:"pink",  nm:"粉紅色", img:"../color/titanium-plum.png",    base:[30,14,22],    bloom:[236,170,196]}
    ]},
    air:{ nm:"iPhone 18 Air", colors:[
      {id:"white", nm:"雲白色", img:"../color/titanium-natural.png", base:[224,223,219], bloom:[40,40,44], neg:true},
      {id:"black", nm:"太空黑", img:"../color/titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"天藍色", img:"../color/titanium-blue.png",    base:[12,20,32],    bloom:[150,190,224]},
      {id:"gold",  nm:"淺金色", img:"../color/titanium-natural.png", base:[222,212,190], bloom:[74,58,32], neg:true}
    ]},
    pro:{ nm:"iPhone 18 Pro", colors:[
      {id:"natural",nm:"原色鈦金屬", img:"../color/titanium-natural.png", base:[214,210,202], bloom:[36,34,30], neg:true},
      {id:"black",  nm:"黑色鈦金屬", img:"../color/titanium-black.png",   base:[10,10,11],  bloom:[216,220,226]},
      {id:"plum",   nm:"梅色鈦金屬", img:"../color/titanium-plum.png",    base:[18,10,16],  bloom:[203,150,182]},
      {id:"blue",   nm:"藍色鈦金屬", img:"../color/titanium-blue.png",    base:[9,15,23],   bloom:[150,186,220]}
    ]}
  };
  MODELS.promax={ nm:"iPhone 18 Pro / Pro Max", colors:MODELS.pro.colors };

  var BUNDLES=[
    {key:"minimal", nm:"新機必備組合", items:"透明殼 · 鏡頭底座貼 · 20W 充電頭", was:1497, sale:999},
    {key:"creator", nm:"創作者組合",   items:"液態矽膠殼 · 指環支架 · 磁吸吸盤", was:1797, sale:1199},
    {key:"leather", nm:"皮革造型組合", items:"皮革手機殼 · 鏡面支架卡包 · 皮革掛繩＋墊片 · 4 種花色", was:2697, sale:1799},
    {key:"fan",     nm:"追星必備組合", items:"鏡面手機殼 · 旋轉支架卡夾", was:1598, sale:1199},
    {key:"home",    nm:"居家快充組合", items:"透明磁吸殼 · 四合一無線充 · 磁吸線 · 65W 快充", was:3787, sale:2599}
  ];

  var p=new URLSearchParams(location.search);
  var mid=p.get("m"); if(!MODELS[mid]) mid="pro";
  var model=MODELS[mid];
  var col=model.colors.filter(function(c){return c.id===p.get("c");})[0] || model.colors[0];

  document.body.classList.toggle("light", !!col.neg);
  document.getElementById("thumb").src=col.img;
  document.getElementById("eyebrow").innerHTML="APIOU &middot; "+model.nm+" &middot; "+col.nm;

  // colour-tinted background (matches the colour world; light for negative colours)
  (function(){
    var b=col.base, bl=col.bloom, neg=!!col.neg;
    function mix(a,c,t){return "rgb("+Math.round(a[0]+(c[0]-a[0])*t)+","+Math.round(a[1]+(c[1]-a[1])*t)+","+Math.round(a[2]+(c[2]-a[2])*t)+")";}
    var basec="rgb("+b[0]+","+b[1]+","+b[2]+")";
    var glow=mix(b,bl,neg?0.5:0.32);
    var edge=mix(b,[0,0,0],neg?0.1:0.28);
    document.body.style.background="radial-gradient(135% 90% at 30% 12%, "+glow+" 0%, "+basec+" 44%, "+edge+" 100%)";
  })();

  // build the 5 bundle cards → each links straight to its offer
  var wrap=document.getElementById("cards");
  BUNDLES.forEach(function(b){
    var off=Math.round(b.sale/b.was*100);
    var a=document.createElement("a"); a.className="card";
    a.href="../offer/?m="+mid+"&c="+col.id+"&b="+b.key;
    a.innerHTML='<div class="info"><div class="nm">'+b.nm+'</div><div class="it">'+b.items+'</div></div>'
      +'<div class="pr"><span class="was">NT$'+b.was+'</span><span class="now">NT$'+b.sale+'</span><span class="off">'+off+'折</span></div>'
      +'<span class="arr">&rsaquo;</span>';
    wrap.appendChild(a);
  });
  var back=document.createElement("a"); back.className="back"; back.href="../color/?m="+mid+"#flip"; back.textContent="← 重新選顏色";
  wrap.appendChild(back);

  // entrance veil (matches the colour) fades — inline, iOS-safe
  var veil=document.getElementById("veil");
  veil.style.background="rgb("+(col.base[0]|0)+","+(col.base[1]|0)+","+(col.base[2]|0)+")";
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.style.opacity="0"; }); });
  setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }, 800);
})();
</script>
</body>
</html>
