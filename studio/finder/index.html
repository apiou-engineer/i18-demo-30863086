<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · 打造你的組合</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#f4f3f0; --soft:rgba(244,243,240,.6); --line:rgba(244,243,240,.2);
    --card:rgba(24,24,27,.82); --good:#7fd0a0;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#0a0a0b;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
    --bgc:#0a0a0b}
  body.light{--ink:#1b1b1e;--soft:rgba(27,27,30,.7);--line:rgba(27,27,30,.2);--card:rgba(255,255,255,.86);--bgc:#d6d2ca;background:#d6d2ca}

  canvas#bg{position:fixed;inset:0;z-index:0;display:block}

  .stage{position:absolute;inset:0;z-index:1;display:grid;place-items:center;perspective:1500px;pointer-events:none}
  .phone-wrap{position:relative;transition:transform .7s var(--ease)}
  .phone{position:relative;height:min(64vh,560px);transition:height .6s var(--ease),transform .6s var(--ease)}
  .phone img{height:100%;width:auto;filter:drop-shadow(0 46px 60px rgba(0,0,0,.55))}
  body.light .phone img{filter:drop-shadow(0 26px 34px rgba(120,116,106,.32))}
  /* result: phone slides left to make room for the bundle card (desktop) */
  body.result .phone-wrap{transform:translateX(-14vw)}
  @media (max-aspect-ratio:1/1){
    .stage{place-items:start center;padding-top:12vh}
    /* Strip heavy GPU compositing on mobile: will-change + drop-shadow filter + the infinite
       float animation together made iOS drop every composited layer (the screen collapsed to
       just the body colour) the moment the result card faded in. */
    .phone{height:min(38vh,340px);animation:none;will-change:auto}
    .phone-wrap{will-change:auto}
    .phone img,body.light .phone img{filter:none}
    body.result .phone-wrap{transform:translateY(-2vh)}
    body.result .phone{height:min(32vh,290px)}
  }

  .ui{position:absolute;inset:0;z-index:3;pointer-events:none}
  .eyebrow{position:absolute;top:clamp(20px,4vh,40px);left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--soft)}

  /* STEP 1 — usage question */
  .ask{position:absolute;left:0;right:0;bottom:clamp(34px,7vh,72px);display:flex;flex-direction:column;align-items:center;gap:20px;
    padding:0 24px;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  @media (max-aspect-ratio:1/1){ .ask{bottom:clamp(30px,6vh,64px);gap:14px} }
  .ask h2{font-weight:300;font-size:clamp(1.4rem,3vw,2.1rem);letter-spacing:-.02em;text-align:center;text-wrap:balance}
  @media (max-aspect-ratio:1/1){ .ask h2{font-size:clamp(1.3rem,5.2vw,1.8rem)} }
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px}
  .chip{pointer-events:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:13px 22px;border-radius:100px;font-size:.98rem;cursor:pointer;
    transition:transform .4s var(--spring),border-color .3s,background .3s}
  .chip:hover{transform:translateY(-3px);border-color:var(--ink)}
  body.result .ask{opacity:0;transform:translateY(20px);pointer-events:none}

  /* STEP 2 — recommendation card */
  .result{position:absolute;top:50%;right:clamp(28px,6vw,90px);transform:translateY(-50%) translateX(30px);width:min(90vw,380px);
    opacity:0;pointer-events:none;transition:opacity .6s var(--ease) .1s,transform .6s var(--spring) .1s}
  body.result .result{opacity:1;transform:translateY(-50%);pointer-events:auto}
  @media (max-aspect-ratio:1/1){
    .result{top:auto;bottom:clamp(24px,5vh,54px);right:0;left:0;margin:0 auto;transform:translateY(30px)}
    body.result .result{transform:none}
  }
  .r-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
  .r-name{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600;letter-spacing:-.02em;margin:6px 0 4px}
  .r-for{color:var(--soft);font-size:.92rem;margin-bottom:16px}
  .r-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .r-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem;
    opacity:0;transform:translateX(10px);animation:itemIn .5s var(--ease) forwards}
  @keyframes itemIn{to{opacity:1;transform:none}}
  .r-item:last-of-type{border-bottom:none}
  .r-item .d{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}
  .r-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .r-sum .lab{font-size:.9rem;color:var(--soft)}
  .r-sum .val{font-family:var(--mono);font-size:1.4rem;font-weight:600}
  .r-note{font-family:var(--mono);font-size:.62rem;color:var(--soft);margin-top:8px;letter-spacing:.04em}
  .r-actions{display:flex;gap:10px;margin-top:18px;align-items:center}
  .btn{pointer-events:auto;appearance:none;border:none;font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer;
    padding:14px 26px;border-radius:100px;transition:transform .5s var(--spring),box-shadow .4s,background .3s,color .3s,opacity .3s}
  .btn.primary{background:var(--ink);color:var(--bgc);box-shadow:0 12px 30px -14px rgba(0,0,0,.6)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:none;color:var(--soft);padding:14px 8px}
  .btn.ghost:hover{color:var(--ink)}

  /* accessory tags that snap in around the phone (magnetic feel) */
  .accessories{position:absolute;inset:0;z-index:2;pointer-events:none}
  .acc{position:absolute;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 13px;
    white-space:nowrap;
    opacity:0;transform:translate(var(--fromx,0),var(--fromy,0)) scale(.7)}
  .acc.snap{animation:snap .7s var(--spring) forwards}
  @keyframes snap{0%{opacity:0}60%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1)}}
  @media (max-aspect-ratio:1/1){ .accessories{display:none} }

  .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:9;
    background:rgba(20,20,20,.92);color:#fff;padding:12px 22px;border-radius:100px;font-size:.9rem;
    opacity:0;transition:opacity .5s var(--ease),transform .5s var(--spring);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .veil{position:absolute;inset:0;z-index:40;background:#d3cfc6;pointer-events:none;opacity:1;transition:opacity .5s var(--ease)}
  .veil.gone{opacity:0}

  /* iOS drops the whole position:fixed layer (phone + UI vanish, only the body bg shows) when a
     descendant transitions/animates on the ask→result state change. Make the swap instant. */
  .stage,.phone-wrap,.phone,.phone img,.ask,.result,.r-item{transition:none !important;animation:none !important}
</style>
</head>
<body>

  <div class="stage"><div class="phone-wrap" id="phoneWrap">
    <div class="phone" id="phone"><img id="phoneImg" src="../color/titanium-natural.png" alt="iPhone 18"></div>
  </div></div>

  <div class="ui">
    <div class="eyebrow">APIOU &middot; iPhone 18</div>

    <div class="ask" id="ask">
      <h2>你最常怎麼使用手機?</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="result" id="result">
      <div class="r-eyebrow">你的 APIOU 組合</div>
      <div class="r-name" id="rName">—</div>
      <div class="r-for" id="rFor"></div>
      <div class="r-card">
        <div id="rItems"></div>
        <div class="r-sum"><span class="lab">組合價</span><span class="val" id="rPrice">—</span></div>
        <div class="r-note">早鳥組合優惠價</div>
      </div>
      <div class="r-actions">
        <button class="btn primary" id="takeBtn">選這組 &rarr;</button>
        <button class="btn ghost" id="restartBtn">重新開始</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="veil" id="veil"></div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var MODELS={
    base:{ nm:"iPhone 18", colors:[
      {id:"white", nm:"白色",   img:"../color/titanium-natural.png", base:[228,227,224], bloom:[40,40,44], neg:true},
      {id:"black", nm:"黑色",   img:"../color/titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"群青色", img:"../color/titanium-blue.png",    base:[10,16,34],    bloom:[120,150,235]},
      {id:"pink",  nm:"粉紅色", img:"../color/titanium-plum.png",    base:[30,14,22],    bloom:[236,170,196]}
    ]},
    air:{ nm:"iPhone 18 Air", colors:[
      {id:"white", nm:"雲白色", img:"../color/titanium-natural.png", base:[224,223,219], bloom:[40,40,44], neg:true},
      {id:"black", nm:"太空黑", img:"../color/titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"天藍色", img:"../color/titanium-blue.png",    base:[12,20,32],    bloom:[150,190,224]},
      {id:"gold",  nm:"淺金色", img:"../color/titanium-natural.png", base:[222,212,190], bloom:[74,58,32], neg:true}
    ]},
    pro:{ nm:"iPhone 18 Pro", colors:[
      {id:"natural",nm:"原色鈦金屬", img:"../color/titanium-natural.png", base:[214,210,202], bloom:[36,34,30], neg:true},
      {id:"black",  nm:"黑色鈦金屬", img:"../color/titanium-black.png",   base:[10,10,11],  bloom:[216,220,226]},
      {id:"plum",   nm:"梅色鈦金屬", img:"../color/titanium-plum.png",    base:[18,10,16],  bloom:[203,150,182]},
      {id:"blue",   nm:"藍色鈦金屬", img:"../color/titanium-blue.png",    base:[9,15,23],   bloom:[150,186,220]}
    ]}
  };
  MODELS.promax={ nm:"iPhone 18 Pro Max", colors:MODELS.pro.colors };
  var params=new URLSearchParams(location.search);
  var mid=params.get("m"); if(!MODELS[mid]) mid="pro";
  var model=MODELS[mid];
  var cid=params.get("c");
  var col=model.colors.filter(function(c){return c.id===cid;})[0] || model.colors[0];
  document.getElementById("phoneImg").src=col.img;
  document.body.classList.toggle("light", !!col.neg);
  document.querySelector(".eyebrow").innerHTML="APIOU &middot; "+model.nm;

  // static CSS backdrop tinted to the chosen colour — no live <canvas> layer, so the page
  // can't hit the GPU compositing collapse that blanked the screen on the result transition.
  (function(){
    var b=col.base, bl=col.bloom;
    function mix(a,c,t){return "rgb("+Math.round(a[0]+(c[0]-a[0])*t)+","+Math.round(a[1]+(c[1]-a[1])*t)+","+Math.round(a[2]+(c[2]-a[2])*t)+")";}
    var base="rgb("+b[0]+","+b[1]+","+b[2]+")";
    var glow=mix(b,bl,col.neg?0.5:0.3);
    var edge=mix(b,[0,0,0],0.14);
    document.body.style.background="radial-gradient(135% 105% at 30% 18%, "+glow+" 0%, "+base+" 48%, "+edge+" 100%)";
  })();

  // usage → bundle mapping
  var USES=[
    {id:"photo", t:"拍照與錄影",   b:"creator"},
    {id:"fan",   t:"追星與蒐集",   b:"fan"},
    {id:"cards", t:"通勤與卡片",   b:"leather"},
    {id:"home",  t:"居家充電",     b:"home"},
    {id:"basic", t:"只要基本款",   b:"minimal"}
  ];
  var BUNDLES={
    minimal:{nm:"新機必備組合", forWho:"基礎保護,也適合想秀出機身顏色的你", items:["透明殼(非磁吸)","鏡頭底座貼","20W 充電頭"], was:1497, sale:999},
    creator:{nm:"創作者組合",   forWho:"拍照、錄影、經營自媒體都合拍", items:["液態矽膠殼","指環支架","磁吸吸盤"], was:1797, sale:1199},
    leather:{nm:"皮革造型組合", forWho:"日常質感,卡片隨身 · 4 種花色", items:["皮革手機殼","鏡面支架卡包","皮革掛繩＋墊片"], was:2697, sale:1799},
    fan:{nm:"追星必備組合",     forWho:"自拍、小卡與鏡面光澤", items:["鏡面手機殼","旋轉支架卡夾"], was:1598, sale:1199},
    home:{nm:"居家快充組合",     forWho:"居家充電,多裝置一次到位", items:["透明磁吸殼","四合一無線充","磁吸線","65W 快充"], was:3787, sale:2599}
  };
  var ACC_POS=[ {x:"-30vw",y:"-24vh"},{x:"30vw",y:"-20vh"},{x:"-32vw",y:"18vh"},{x:"30vw",y:"22vh"} ];

  var state={bundle:null};
  // chips
  var chipsEl=document.getElementById("chips");
  USES.forEach(function(u){
    var b=document.createElement("button");b.className="chip";b.textContent=u.t;
    b.addEventListener("click",function(){ choose(u); });
    chipsEl.appendChild(b);
  });

  function choose(u){
    var key=u.b, b=BUNDLES[key]; state.bundle=key;
    document.getElementById("rName").textContent=b.nm;
    document.getElementById("rFor").textContent=b.forWho;
    var it=document.getElementById("rItems"); it.innerHTML="";
    b.items.forEach(function(x,i){
      var d=document.createElement("div"); d.className="r-item"; d.style.animationDelay=(0.25+i*0.09)+"s";
      d.innerHTML='<span class="d"></span><span>'+x+'</span>'; it.appendChild(d);
    });
    document.getElementById("rPrice").textContent="NT$"+b.sale;
    var noteEl=document.querySelector(".r-note"); if(noteEl){ noteEl.textContent="早鳥組合價 · 原價 NT$"+b.was; }
    // clear parallax inline transform so the CSS left-shift applies cleanly
    document.getElementById("phoneWrap").style.transform="";
    document.body.classList.add("result");
  }

  document.getElementById("restartBtn").addEventListener("click",function(){ document.body.classList.remove("result"); });
  document.getElementById("takeBtn").addEventListener("click",function(){
    document.querySelector(".ui").style.transition="opacity .3s"; document.querySelector(".ui").style.opacity="0";
    setTimeout(function(){ location.href="../offer/?m="+mid+"&c="+col.id+"&b="+state.bundle; }, 280);
  });
  var toastT; function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},3000);}

  // entrance veil fade (veil matches the chosen colour's world so there's no flash)
  var veil=document.getElementById("veil");
  var vb=col.neg?col.base:[col.base[0]+8,col.base[1]+8,col.base[2]+8];
  veil.style.background="rgb("+(vb[0]|0)+","+(vb[1]|0)+","+(vb[2]|0)+")";
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("gone"); }); });
  setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }, 900);
})();
</script>
</body>
</html>
