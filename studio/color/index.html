<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · 選擇顏色</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#f4f3f0; --soft:rgba(244,243,240,.6); --line:rgba(244,243,240,.2);
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
    --serif:"Fraunces","Noto Serif TC",Georgia,"Songti TC",serif;
  }
  @font-face{font-family:"Fraunces";src:url(../fonts/Fraunces-disp.woff2) format("woff2");font-weight:300 700;font-display:swap}
  @font-face{font-family:"Noto Serif TC";src:url(../fonts/NotoSerifTC-title.woff2) format("woff2");font-weight:400 600;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#0a0a0b;overflow:hidden;-webkit-font-smoothing:antialiased;
    --bgc:#0a0a0b;transition:--bgc .6s}
  /* negative / light world (Titanium Natural): flip UI to dark ink */
  body.light{--ink:#1b1b1e;--soft:rgba(27,27,30,.72);--line:rgba(27,27,30,.2);--bgc:#d6d2ca;background:#d6d2ca}

  /* code-generated grainy studio backdrop (soft light top-left) */
  canvas#bg{position:fixed;inset:0;z-index:0;display:block}

  /* phone (transparent cut-out) floating on the backdrop */
  .stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center;perspective:1500px;pointer-events:none}
  .phone-wrap{position:relative;transition:transform .5s var(--ease);transform-style:preserve-3d;will-change:transform}
  /* entrance flip: phone turns in from edge-on (clearly visible, plays after the veil clears) */
  .stage.enter .phone-wrap{animation:flipIn 1.2s var(--ease) .12s both}
  @keyframes flipIn{0%{transform:rotateY(-118deg) scale(.86)}55%{transform:rotateY(18deg) scale(1.02)}100%{transform:rotateY(0) scale(1)}}
  /* light veil bridges from the home page's bright bg, then clears quickly so the flip shows */
  .veil{position:fixed;inset:0;z-index:40;background:#d3cfc6;pointer-events:none;opacity:1;transition:opacity .5s var(--ease)}
  .veil.gone{opacity:0}
  .phone{position:relative;height:min(76vh,660px);animation:float 9s var(--ease) infinite;will-change:transform}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .phone img{position:absolute;inset:0;height:100%;width:auto;left:50%;transform:translateX(-50%);
    filter:drop-shadow(0 46px 60px rgba(0,0,0,.55));opacity:0;transition:opacity .6s var(--ease)}
  .phone img.on{opacity:1}
  /* light (Natural) world: soft warm contact shadow instead of a dark box */
  body.light .phone img{filter:drop-shadow(0 26px 34px rgba(120,116,106,.32))}
  /* soft contact shadow under phone */
  .shadow{position:absolute;bottom:-4%;left:50%;transform:translateX(-50%);width:52%;height:5%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(6px)}

  .ui{position:fixed;inset:0;z-index:3;pointer-events:none}
  .eyebrow{position:absolute;top:clamp(20px,4vh,40px);left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--soft);
    opacity:0;animation:fade 1s var(--ease) .2s forwards}
  @keyframes fade{to{opacity:1}}

  .head{position:absolute;top:clamp(70px,12vh,140px);left:clamp(24px,6vw,86px);max-width:12ch}
  .head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.7rem,5.6vw,4.8rem);line-height:.98;letter-spacing:-.01em;text-wrap:balance}
  .head p{font-family:var(--serif);margin-top:18px;color:var(--soft);font-size:clamp(1.05rem,1.6vw,1.25rem);font-weight:500;max-width:26ch}
  .cname{position:absolute;left:0;right:0;text-align:center;bottom:clamp(56px,8vh,96px);z-index:3;pointer-events:none;
    font-family:var(--mono);font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);transition:opacity .4s}
  @media (max-aspect-ratio:1/1){ .cname{bottom:auto;top:66vh} }
  .cont{position:absolute;left:50%;bottom:clamp(20px,4vh,40px);transform:translateX(-50%);pointer-events:auto;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
    background:none;border:1px solid var(--line);border-radius:100px;padding:11px 22px;cursor:pointer;
    transition:color .4s,border-color .4s,transform .4s var(--spring)}
  .cont:hover{color:var(--ink);border-color:var(--ink);transform:translateX(-50%) translateY(-2px)}

  .colors{position:absolute;pointer-events:auto;display:flex}
  @media (min-aspect-ratio:1/1){
    .colors{right:clamp(30px,6vw,90px);top:50%;transform:translateY(-50%);flex-direction:column;gap:22px}
    .swatch{flex-direction:row;gap:16px}
  }
  @media (max-aspect-ratio:1/1){
    .head{top:clamp(40px,6vh,80px);left:0;right:0;text-align:center;max-width:none;padding:0 24px}
    .head h1{font-size:clamp(2.3rem,9vw,3.1rem)}
    .head p{margin-left:auto;margin-right:auto;font-size:1.02rem;max-width:28ch}
    .stage{place-items:start center;padding-top:21vh}
    .phone{height:min(43vh,390px)}
    .colors{left:0;right:0;bottom:clamp(94px,15vh,130px);justify-content:center;gap:clamp(22px,8vw,40px)}
    .swatch{flex-direction:column;gap:0;align-items:center}
    .swatch .nm{display:none}
    .swatch .dot{width:38px;height:38px}
    .cont{bottom:clamp(22px,4vh,38px)}
  }
  .swatch{background:none;border:none;cursor:pointer;display:flex;align-items:center;transition:transform .5s var(--spring)}
  .swatch:hover{transform:translateY(-3px)}
  @media (min-aspect-ratio:1/1){ .swatch:hover{transform:translateX(-4px)} }
  /* flat swatches */
  .swatch .dot{width:clamp(30px,3vw,38px);height:clamp(30px,3vw,38px);border-radius:50%;position:relative;flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(255,255,255,.14);transition:transform .4s var(--spring),box-shadow .4s var(--ease)}
  .swatch:hover .dot{box-shadow:0 0 0 1px rgba(255,255,255,.4)}
  .swatch[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--bgc,#0a0a0b),0 0 0 4px var(--ink)}
  .swatch .nm{font-size:.9rem;font-weight:500;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;opacity:.7;transition:opacity .4s}
  .swatch[aria-pressed="true"] .nm{opacity:1}
  .d-blue{background:#7fa3cf}
  .d-plum{background:#6f4258}
  .d-natural{background:#cfcabf}
  .d-black{background:#1c1c20}
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="stage" id="stage"><div class="phone-wrap" id="phoneWrap">
    <div class="phone" id="phone"></div>
    <div class="shadow"></div>
  </div></div>
  <div class="veil" id="veil"></div>

  <div class="ui">
    <div class="head">
      <h1>What is your iPhone color?</h1>
      <p>選擇你的手機顏色</p>
    </div>
    <div class="cname" id="cname">Natural</div>
    <div class="colors" id="colors"></div>
    <button class="cont" id="cont" aria-label="繼續">繼續&nbsp;&nbsp;&darr;</button>
  </div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  // per-model colour lists. Light/neg colour is first in each list so the entry
  // from the (light) model page stays silky. Phone images are shared Pro cutouts
  // as placeholders until per-model images are provided.
  var MODELS={
    base:{ nm:"iPhone 18", colors:[
      {id:"white", nm:"白色",   en:"White",       hex:"#e7e6e3", img:"titanium-natural.png", base:[228,227,224], bloom:[40,40,44], neg:true},
      {id:"black", nm:"黑色",   en:"Black",       hex:"#1c1c20", img:"titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"群青色", en:"Ultramarine", hex:"#3f52d6", img:"titanium-blue.png",    base:[10,16,34],    bloom:[120,150,235]},
      {id:"pink",  nm:"粉紅色", en:"Pink",        hex:"#e6a6bd", img:"titanium-plum.png",    base:[30,14,22],    bloom:[236,170,196]}
    ]},
    air:{ nm:"iPhone 18 Air", colors:[
      {id:"white", nm:"雲白色", en:"Cloud White", hex:"#e9e8e4", img:"titanium-natural.png", base:[224,223,219], bloom:[40,40,44], neg:true},
      {id:"black", nm:"太空黑", en:"Space Black", hex:"#1a1a1e", img:"titanium-black.png",   base:[9,9,11],      bloom:[210,214,222]},
      {id:"blue",  nm:"天藍色", en:"Sky Blue",    hex:"#9cc2e0", img:"titanium-blue.png",    base:[12,20,32],    bloom:[150,190,224]},
      {id:"gold",  nm:"淺金色", en:"Light Gold",  hex:"#dcc9a2", img:"titanium-natural.png", base:[222,212,190], bloom:[74,58,32], neg:true}
    ]},
    pro:{ nm:"iPhone 18 Pro", colors:[
      {id:"natural",nm:"原色鈦金屬", en:"Natural", hex:"#cfcabf", img:"titanium-natural.png", base:[214,210,202], bloom:[36,34,30], neg:true},
      {id:"black",  nm:"黑色鈦金屬", en:"Black",   hex:"#1c1c20", img:"titanium-black.png",   base:[10,10,11],  bloom:[216,220,226]},
      {id:"plum",   nm:"梅色鈦金屬", en:"Plum",    hex:"#6f4258", img:"titanium-plum.png",    base:[18,10,16],  bloom:[203,150,182]},
      {id:"blue",   nm:"藍色鈦金屬", en:"Blue",    hex:"#7fa3cf", img:"titanium-blue.png",    base:[9,15,23],   bloom:[150,186,220]}
    ]}
  };
  MODELS.promax={ nm:"iPhone 18 Pro Max", colors:MODELS.pro.colors };
  var mid=new URLSearchParams(location.search).get("m"); if(!MODELS[mid]) mid="pro";
  var model=MODELS[mid];
  var COLORS=model.colors;
  var preC=new URLSearchParams(location.search).get("c");
  var state={color:COLORS.filter(function(x){return x.id===preC;})[0]||COLORS[0]};

  // preload + stack phone images (cross-fade between colours)
  var phoneEl=document.getElementById("phone"), imgs={};
  COLORS.forEach(function(c){
    var im=new Image(); im.src=c.img; im.className="pimg"; im.alt="iPhone 18 "+c.nm;
    im.style.cssText=""; phoneEl.appendChild(im); imgs[c.id]=im;
    im.classList.add("pimg");
  });
  // apply base class for styling
  Array.prototype.forEach.call(phoneEl.querySelectorAll("img"),function(im){ im.className="pimg"; im.setAttribute("style",""); });
  // set the .phone img styles via CSS class already; ensure 'on' for default
  function showColor(c){
    Object.keys(imgs).forEach(function(k){ imgs[k].classList.toggle("on", k===c.id); });
  }

  // swatches
  var cEl=document.getElementById("colors");
  COLORS.forEach(function(c){
    var b=document.createElement("button");b.className="swatch";b.setAttribute("aria-pressed",String(c===state.color));
    b.innerHTML='<span class="dot" style="background:'+c.hex+'"></span><span class="nm">'+c.nm+'</span>';
    b.addEventListener("click",function(){ pick(c); });
    cEl.appendChild(b); c._el=b;
  });
  function pick(c){
    state.color=c;
    COLORS.forEach(function(x){ x._el.setAttribute("aria-pressed",String(x===c)); });
    showColor(c);
    target.base=c.base.slice(); target.bloom=c.bloom.slice(); target.neg=c.neg?1:0;
    document.body.classList.toggle("light", !!c.neg);
    var nmEl=document.getElementById("cname"); nmEl.style.opacity=0;
    setTimeout(function(){ nmEl.textContent=c.en; nmEl.style.opacity=1; },220);
    if(!reduce){ document.getElementById("phoneWrap").animate(
      [{transform:"scale(1)"},{transform:"scale(1.035)"},{transform:"scale(1)"}],{duration:640,easing:"cubic-bezier(.34,1.4,.5,1)"}); }
  }
  showColor(state.color);
  // init to the default (Natural, negative/light) world
  document.body.classList.toggle("light", !!state.color.neg);
  document.getElementById("cname").textContent=state.color.en;

  // continue → carry the chosen colour to the bundle finder
  document.getElementById("cont").addEventListener("click",function(){
    document.querySelector(".ui").style.transition="opacity .35s"; document.querySelector(".ui").style.opacity="0";
    setTimeout(function(){ location.href="../finder/?c="+state.color.id+"&m="+mid; }, 300);
  });

  // entrance: if we arrived from the home flip (#flip), run the flip-in + veil fade
  var veil=document.getElementById("veil"), stageEl=document.getElementById("stage");
  if(location.hash==="#flip" && !reduce){
    stageEl.classList.add("enter");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("gone"); }); });
  }else{
    veil.classList.add("gone");
  }
  setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }, 1200);

  // parallax tilt — suppressed during the entrance flip so it isn't overridden
  var parallaxOn=true;
  if(location.hash==="#flip" && !reduce){ parallaxOn=false; setTimeout(function(){ parallaxOn=true; }, 1450); }
  if(!reduce && window.matchMedia("(pointer:fine)").matches){
    addEventListener("pointermove",function(e){
      if(!parallaxOn)return;
      var x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5;
      document.getElementById("phoneWrap").style.transform="rotateY("+(x*9)+"deg) rotateX("+(-y*7)+"deg)";
    });
  }

  // ---------- grainy studio backdrop (reproduces the reference) ----------
  var cv=document.getElementById("bg"), ctx=cv.getContext("2d"), W,H,dpr=Math.min(2,window.devicePixelRatio||1);
  var grain=null;
  function buildGrain(){
    var gw=Math.ceil(innerWidth), gh=Math.ceil(innerHeight);
    var g=document.createElement("canvas"); g.width=gw; g.height=gh;
    var gx=g.getContext("2d"); var id=gx.createImageData(gw,gh); var d=id.data;
    for(var i=0;i<d.length;i+=4){ var v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=16; }
    gx.putImageData(id,0,0); grain=g;
  }
  function resize(){ W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; buildGrain(); }
  resize(); addEventListener("resize",resize);

  // light position eases toward pointer (subtle)
  var lx=0.22, ly=0.16, tlx=0.22, tly=0.16;
  addEventListener("pointermove",function(e){ tlx=0.14+ (e.clientX/innerWidth)*0.3; tly=0.10+ (e.clientY/innerHeight)*0.25; });
  // background tint eases toward the selected colour
  // init the world to the DEFAULT colour (incl. its neg flag) so the very first frame
  // already matches the model page's negative light world — no jump when the veil lifts
  var cur={base:state.color.base.slice(), bloom:state.color.bloom.slice(), neg:state.color.neg?1:0};
  var target={base:state.color.base.slice(), bloom:state.color.bloom.slice(), neg:state.color.neg?1:0};
  function lerp(a,b,t){return a+(b-a)*t;}
  function rgb(a){return "rgb("+(a[0]|0)+","+(a[1]|0)+","+(a[2]|0)+")";}
  // one soft radial bloom of colour `col` at (cx,cy), radius R, peak alpha a
  function blob(cx,cy,R,col,a){
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0,   "rgba("+(col[0]|0)+","+(col[1]|0)+","+(col[2]|0)+","+a+")");
    g.addColorStop(0.42,"rgba("+(col[0]*0.72|0)+","+(col[1]*0.72|0)+","+(col[2]*0.72|0)+","+(a*0.38)+")");
    g.addColorStop(1,   "rgba("+(col[0]|0)+","+(col[1]|0)+","+(col[2]|0)+",0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  var T=0;
  function draw(){
    T+=reduce?0:0.0045;
    lx=lerp(lx,tlx,.05); ly=lerp(ly,tly,.05);
    for(var i=0;i<3;i++){ cur.base[i]=lerp(cur.base[i],target.base[i],.05); cur.bloom[i]=lerp(cur.bloom[i],target.bloom[i],.05); }
    cur.neg=lerp(cur.neg,target.neg,.05);
    var b=cur.bloom, neg=cur.neg>0.5, R=Math.max(W,H);
    function br(base,amp,ph){return base+amp*Math.sin(T*1.05+ph);}  // brightness breathing
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle=rgb(cur.base); ctx.fillRect(0,0,W,H);
    if(neg){
      // light / Natural world: slow drifting soft shadows (photo-negative)
      var dk=[b[0]*0.5,b[1]*0.5,b[2]*0.5];
      blob((0.30+0.08*Math.sin(T*0.6))*W,      (0.24+0.06*Math.cos(T*0.7))*H,      R*1.2, dk, br(0.30,0.10,0));
      blob((0.72+0.10*Math.sin(T*0.45+1.3))*W, (0.64+0.08*Math.cos(T*0.5+2.0))*H,  R*1.0, dk, br(0.20,0.08,1.7));
      blob(lx*W,ly*H, R*0.7, [255,255,255], 0.05);  // soft pointer light
    }else{
      // dark world: additive luminous aurora — blooms brighten as they overlap
      ctx.globalCompositeOperation="lighter";
      blob((0.30+0.10*Math.sin(T*0.7))*W,      (0.20+0.08*Math.cos(T*0.9))*H,      R*1.15, b, br(0.40,0.15,0));
      blob((0.72+0.12*Math.sin(T*0.5+1.3))*W,  (0.34+0.10*Math.cos(T*0.6+2.1))*H,  R*0.95, b, br(0.28,0.13,1.7));
      blob((0.50+0.14*Math.sin(T*0.4+3.0))*W,  (0.80+0.09*Math.cos(T*0.55+0.6))*H, R*1.05, b, br(0.22,0.11,3.4));
      blob(lx*W,ly*H, R*0.6, b, 0.16);              // pointer bloom
      ctx.globalCompositeOperation="source-over";
    }
    // floor grounding — inverts with neg (dark floor on dark worlds, soft on light)
    var fg=ctx.createLinearGradient(0,H*0.8,0,H);
    var floorA=lerp(0.25,0.10,cur.neg);
    fg.addColorStop(0,"rgba(0,0,0,0)"); fg.addColorStop(.7,"rgba(255,255,255,0.03)"); fg.addColorStop(1,"rgba(0,0,0,"+floorA+")");
    ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    if(grain){ ctx.globalAlpha=1; ctx.drawImage(grain,0,0,W,H); }
    if(!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if(reduce) draw();
})();
</script>
<style>
  .phone img.pimg{position:absolute;inset:0;height:100%;width:auto;left:50%;transform:translateX(-50%);
    filter:drop-shadow(0 46px 60px rgba(0,0,0,.55));opacity:0;transition:opacity .6s var(--ease)}
  .phone img.pimg.on{opacity:1}
</style>
</body>
</html>
