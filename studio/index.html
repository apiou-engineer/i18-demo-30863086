<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · Your new iPhone deserves better</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#1b1c1e; --soft:rgba(27,28,30,.58); --line:rgba(27,28,30,.18);
    --btn-bg:#161719; --btn-fg:#f6f7f8;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    background:radial-gradient(80% 70% at 50% 22%,#f4f5f6,#e6e8ea 70%,#dfe1e3)}

  .hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,3vh,34px) 24px clamp(24px,5vh,52px);gap:clamp(10px,2vh,20px)}

  .topline{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);
    opacity:0;animation:fade 1.2s var(--ease) .2s forwards;flex:0 0 auto}
  @keyframes fade{to{opacity:1}}

  .headline{flex:0 0 auto;text-align:center;font-weight:200;letter-spacing:-.035em;line-height:1.0;
    font-size:clamp(1.9rem,5vw,4rem);max-width:16ch;text-wrap:balance;margin-top:clamp(4px,1.5vh,14px)}
  .headline .rise{display:inline-block;opacity:0;transform:translateY(20px);animation:rise 1s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* video stage — natural colour, tap to thaw */
  .stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative;width:100%;cursor:pointer}
  .ice-wrap{position:relative;height:100%;display:grid;place-items:center;animation:float 8s var(--ease) infinite;will-change:transform}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .ice{display:block;height:100%;max-height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:14px;
    box-shadow:0 30px 60px -26px rgba(70,100,120,.4)}
  /* wide screens: cap the portrait video so it doesn't overflow and crowd the CTA */
  @media (min-aspect-ratio:1/1){ .ice{height:auto;max-height:100%;width:auto;max-width:min(46vh,420px)} }

  /* tap hint */
  .hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;
    pointer-events:none;transition:opacity .6s var(--ease)}
  .hint .ring{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(40,50,60,.5);position:relative}
  .hint .ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(40,50,60,.5);animation:ripple 2.2s var(--ease) infinite}
  @keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
  .hint .dot{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;background:rgba(40,50,60,.7);transform:translate(-50%,-50%)}
  .hint .txt{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
  .stage.thawed .hint{opacity:0}

  .lower{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,20px);text-align:center}
  .subq{font-weight:300;font-size:clamp(1.1rem,2.3vw,1.55rem);letter-spacing:-.01em;color:var(--ink);opacity:0;animation:fade .9s var(--ease) 1.2s forwards}
  .btn-row{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fade .9s var(--ease) 1.4s forwards}
  .btn{appearance:none;border:none;font-family:inherit;font-size:1.02rem;font-weight:500;letter-spacing:.01em;
    padding:16px 34px;border-radius:100px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .5s var(--spring),box-shadow .5s var(--ease),background .4s,color .4s}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 12px 34px -14px rgba(30,50,70,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
  .btn.primary::after{content:"";position:absolute;top:0;left:-70%;width:52%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transition:left .7s var(--ease)}
  .btn.primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 20px 46px -16px rgba(30,50,70,.6)}
  .btn.primary:hover::after{left:130%}
  .btn.primary:active{transform:translateY(-1px) scale(.99)}
  .btn.secondary{background:rgba(255,255,255,.72);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn.secondary:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--ink);background:rgba(255,255,255,.9)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:9;
    background:rgba(22,23,25,.92);color:#fff;padding:12px 22px;border-radius:100px;font-size:.9rem;
    opacity:0;transition:opacity .5s var(--ease),transform .5s var(--spring);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){.ice-wrap,.hint .ring::after{animation:none}*{transition-duration:.15s!important}}
</style>
</head>
<body>
  <div class="hero">
    <div class="topline">APIOU &middot; iPhone 18 Studio</div>
    <h1 class="headline">
      <span class="rise" style="animation-delay:.35s">Your new iPhone</span><br>
      <span class="rise" style="animation-delay:.55s">deserves better.</span>
    </h1>

    <div class="stage" id="stage">
      <div class="ice-wrap">
        <video class="ice" id="ice" src="ice-crack.mp4" poster="ice-silver.jpg" muted playsinline preload="auto"></video>
      </div>
      <div class="hint" id="hint">
        <div class="ring"><span class="dot"></span></div>
        <div class="txt">Tap to thaw</div>
      </div>
    </div>

    <div class="lower">
      <div class="subq">Do you have your iPhone 18 yet?</div>
      <div class="btn-row">
        <button class="btn primary" id="yesBtn">Yes, I do.</button>
        <button class="btn secondary" id="noBtn">Not yet.</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var vid=document.getElementById("ice"), stage=document.getElementById("stage");
  var SLOW=0.5, thawing=false;

  function thaw(){
    if(thawing)return;
    thawing=true;
    stage.classList.add("thawed");
    try{ vid.currentTime=0; }catch(e){}
    vid.playbackRate=SLOW;
    var p=vid.play();
    if(p&&p.catch)p.catch(function(){ thawing=false; stage.classList.remove("thawed"); });
  }
  vid.addEventListener("play",function(){ vid.playbackRate=SLOW; });
  vid.addEventListener("ended",function(){
    // hold on the cracked final frame; allow re-tap to refreeze+thaw again
    thawing=false;
  });

  // tap anywhere on the ice/stage to thaw; buttons keep their own behaviour
  stage.addEventListener("click",thaw);
  document.addEventListener("keydown",function(e){ if(e.key===" "||e.key==="Enter"){ thaw(); } });

  // second tap after cracked → refreeze (reverse) for a satisfying loop on demand
  stage.addEventListener("click",function(){
    if(vid.duration && vid.currentTime>=vid.duration-0.1 && !thawing){
      refreeze();
    }
  });
  function refreeze(){
    stage.classList.remove("thawed");
    var step=function(){
      vid.currentTime=Math.max(0,vid.currentTime-0.02);
      if(vid.currentTime<=0.02){ vid.currentTime=0; return; }
      requestAnimationFrame(step);
    };
    vid.pause(); requestAnimationFrame(step);
  }

  var toastT;
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},3000);}
  document.getElementById("yesBtn").addEventListener("click",function(e){e.stopPropagation();toast("下一步:顏色世界(其他顏色素材到位就接上)");});
  document.getElementById("noBtn").addEventListener("click",function(e){e.stopPropagation();toast("這裡會導向「現役機型 + 配件」頁(待接連結)");});
})();
</script>
</body>
</html>
