<title>APIOU · iPhone 18 早鳥預購</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --btn-bg:#f4f4f2; --btn-fg:#141414;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:#f3f2ef;background:#1a1a1a;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* fullscreen frame sequence, edge to edge */
  .stage{position:fixed;inset:0;z-index:0;cursor:pointer;touch-action:none;overflow:hidden}
  #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
  /* subtle vignette + top/bottom scrims so overlaid text stays legible on any frame */
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(0,0,0,.42),transparent 26%,transparent 62%,rgba(0,0,0,.5)),
      radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.28))}

  .ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:clamp(22px,5vh,54px) 24px clamp(28px,6vh,64px);pointer-events:none;text-align:center}

  .top{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,26px)}
  .topline{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,242,239,.66);
    opacity:0;animation:fade 1.2s var(--ease) .2s forwards}
  @keyframes fade{to{opacity:1}}
  .headline{font-weight:200;letter-spacing:-.035em;line-height:1.0;font-size:clamp(2.1rem,5.6vw,4.6rem);max-width:15ch;text-wrap:balance;
    text-shadow:0 2px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
  .headline .rise{display:inline-block;opacity:0;transform:translateY(20px);animation:rise 1s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* interaction invite: a soft pulsing point of light over the phone */
  .invite{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:76px;height:76px;pointer-events:none;
    transition:opacity .8s var(--ease)}
  .invite .core{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,.2) 60%,transparent 72%);
    box-shadow:0 0 24px 6px rgba(255,255,255,.5);animation:corePulse 2.6s var(--ease) infinite}
  .invite .halo,.invite .halo2{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
  .invite .halo{animation:halo 2.6s var(--ease) infinite}
  .invite .halo2{animation:halo 2.6s var(--ease) 1.3s infinite}
  @keyframes halo{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.5);opacity:0}}
  @keyframes corePulse{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.15);opacity:1}}
  .stage.touched ~ .invite, .invite.gone{opacity:0}

  .bottom{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,22px)}
  .bottom.focusq{animation:focusq 1.3s var(--ease)}
  @keyframes focusq{0%{transform:translateY(0)}30%{transform:translateY(-8px)}60%{transform:translateY(0)}}
  .bottom.focusq .subq{animation:fade .01s forwards}
  .subq{font-weight:300;font-size:clamp(1.05rem,2.3vw,1.5rem);letter-spacing:-.01em;color:#f3f2ef;
    text-shadow:0 1px 20px rgba(0,0,0,.6);opacity:0;animation:fade .9s var(--ease) 1.2s forwards}
  .btn-row{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fade .9s var(--ease) 1.4s forwards}
  .btn{pointer-events:auto;appearance:none;border:none;font-family:inherit;font-size:1.02rem;font-weight:500;letter-spacing:.01em;
    padding:16px 34px;border-radius:100px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .5s var(--spring),box-shadow .5s var(--ease),background .4s,color .4s,opacity .4s}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 14px 40px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14)}
  .btn.primary::after{content:"";position:absolute;top:0;left:-70%;width:52%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transition:left .7s var(--ease)}
  .btn.primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 22px 50px -18px rgba(0,0,0,.75)}
  .btn.primary:hover::after{left:130%}
  .btn.primary:active{transform:translateY(-1px) scale(.99)}
  .btn.secondary{background:rgba(255,255,255,.14);color:#f3f2ef;box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .btn.secondary:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);background:rgba(255,255,255,.22)}

  /* when fully healed, gently invite the primary CTA */
  .btn.primary.ready{animation:readyPulse 2.2s var(--ease) infinite}
  @keyframes readyPulse{0%,100%{box-shadow:0 14px 40px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14)}50%{box-shadow:0 14px 40px -16px rgba(0,0,0,.7),0 0 0 6px rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.14)}}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:9;
    background:rgba(20,20,20,.92);color:#fff;padding:12px 22px;border-radius:100px;font-size:.9rem;
    opacity:0;transition:opacity .5s var(--ease),transform .5s var(--spring);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* flip transition veil (rises as the phone turns edge-on, hands off to colour world) */
  .flip-veil{position:fixed;inset:0;z-index:30;background:#d3cfc6;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}

  /* iOS-style notification banner */
  .ios-note{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);z-index:20;
    width:min(92vw,430px);display:flex;gap:12px;align-items:center;cursor:pointer;
    padding:13px 15px;border-radius:22px;pointer-events:auto;
    background:rgba(30,30,32,.42);backdrop-filter:saturate(1.6) blur(26px);-webkit-backdrop-filter:saturate(1.6) blur(26px);
    box-shadow:0 16px 44px -12px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.18);
    opacity:0;transition:transform .7s var(--spring),opacity .5s var(--ease)}
  .ios-note.show{transform:translate(-50%,0);opacity:1}
  .ios-note .ic{flex:0 0 auto;width:42px;height:42px;border-radius:11px;overflow:hidden;
    background:#ffffff;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .ios-note .ic img{width:70%;height:70%;object-fit:contain}
  .ios-note .bd{flex:1 1 auto;min-width:0;color:#f4f4f5}
  .ios-note .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ios-note .title{font-weight:600;font-size:.94rem;letter-spacing:.01em}
  .ios-note .time{flex:0 0 auto;font-size:.74rem;color:rgba(255,255,255,.6);margin-right:20px}
  .ios-note .msg{font-size:.9rem;line-height:1.34;color:rgba(255,255,255,.9);margin-top:2px}
  .ios-note .close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(120,120,128,.5);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;
    opacity:0;transform:scale(.6);transition:opacity .4s var(--ease) .5s,transform .4s var(--spring) .5s}
  .ios-note.show .close{opacity:1;transform:scale(1)}
  .ios-note .close:hover{background:rgba(120,120,128,.8)}

  /* MOBILE (portrait): show whole frame (smaller phone) on a matching beige, dark UI text */
  @media (max-aspect-ratio:1/1){
    body{background:radial-gradient(78% 60% at 50% 30%,#c3bfb4,#adab9f)}
    #frame{object-fit:contain;transform:translateY(-6vh) scale(1.1);transform-origin:center}
    .scrim{display:none}
    .topline{color:rgba(28,27,24,.55)}
    .subq{color:#1c1b18;text-shadow:none}
    .btn.primary{background:#161719;color:#f4f4f2}
    .btn.secondary{background:rgba(0,0,0,.05);color:#1c1b18;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
    .invite .core{box-shadow:0 0 24px 6px rgba(255,255,255,.7)}
  }
  @media (prefers-reduced-motion:reduce){.invite *{animation:none}.btn.primary.ready{animation:none}*{transition-duration:.15s!important}}
</style>

    </div>
    <div class="bottom">
      <div class="subq">你已經有 iPhone 18 了嗎?</div>
      <div class="btn-row">
        <button class="btn primary" id="yesBtn">已經有了</button>
        <button class="btn secondary" id="noBtn">還沒有</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="flip-veil" id="flipVeil"></div>

<script>
(function(){
  var N=48;
  var stage=document.getElementById("stage"), frame=document.getElementById("frame"), invite=document.getElementById("invite");
  var yesBtn=document.getElementById("yesBtn");

  var DIR = window.matchMedia("(min-aspect-ratio:1/1)").matches ? "frames-desktop" : "frames";
  function srcFor(i){ return DIR+"/f_"+String(i).padStart(3,"0")+".jpg"; }
  var srcs=[];
  for(var i=0;i<N;i++){ srcs.push(srcFor(i)); var im=new Image(); im.src=srcs[i]; }

  // DEFAULT = broken (frame 0)
  frame.src=srcs[0];

  // phone-SCREEN region as fractions of the SOURCE image (x0,y0,x1,y1).
  // Interaction only counts inside this region.
  var IS_DESKTOP = (DIR==="frames-desktop");
  var FIT = IS_DESKTOP ? "cover" : "contain"; // desktop fills; mobile shows whole frame (smaller phone)
  var HOT = IS_DESKTOP
    ? {x0:0.435,y0:0.16,x1:0.565,y1:0.86}   // 16:9 desktop clip: tall centred phone
    : {x0:0.29, y0:0.27, x1:0.71, y1:0.74};  // portrait centred crop: phone screen area

  // mobile: enlarge + shift the frame up (must match the CSS transform below)
  var MOB_SCALE = IS_DESKTOP ? 1 : 1.1;
  function mobTY(){ return IS_DESKTOP ? 0 : -0.06*innerHeight; } // -6vh

  // map image-fraction → viewport rect through the actual object-fit + mobile transform
  function hotRect(){
    var CW=innerWidth, CH=innerHeight;
    var IW=frame.naturalWidth||16, IH=frame.naturalHeight||9;
    var scale = FIT==="cover" ? Math.max(CW/IW, CH/IH) : Math.min(CW/IW, CH/IH);
    var rw=IW*scale, rh=IH*scale, ox=(CW-rw)/2, oy=(CH-rh)/2;
    var r={ x0:ox+HOT.x0*rw, y0:oy+HOT.y0*rh, x1:ox+HOT.x1*rw, y1:oy+HOT.y1*rh };
    if(!IS_DESKTOP){ // apply CSS transform: scale about center, then translateY
      var cx=CW/2, cy=CH/2, s=MOB_SCALE, ty=mobTY();
      r.x0=cx+(r.x0-cx)*s; r.x1=cx+(r.x1-cx)*s;
      r.y0=cy+(r.y0-cy)*s+ty; r.y1=cy+(r.y1-cy)*s+ty;
    }
    return r;
  }
  function inHot(x,y){ var h=hotRect(); return x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1; }
  function placeInvite(){ var h=hotRect(); invite.style.left=((h.x0+h.x1)/2)+"px"; invite.style.top=((h.y0+h.y1)/2)+"px"; }
  frame.addEventListener("load",placeInvite); addEventListener("resize",placeInvite); placeInvite();

  // progress 0..1 (0 broken → 1 healed). Direction-agnostic: ANY movement inside
  // the screen heals. One-way (won't re-crack). Faster.
  var progress=0, shown=0, touched=false, lastX=null, lastY=null;
  var SENS=2.6;
  function show(idx){
    idx=Math.max(0,Math.min(N-1,Math.round(idx)));
    if(idx===shown)return;
    frame.src=srcs[idx];
    shown=idx;
  }
  var noteShown=false;
  function heal(amount){
    if(progress>=1)return;
    progress=Math.min(1,progress+amount);
    show(progress*(N-1));
    if(!touched){ touched=true; stage.classList.add("touched"); invite.classList.add("gone"); }
    if(progress>=0.999){
      yesBtn.classList.add("ready");
      if(!noteShown){ noteShown=true; setTimeout(function(){ document.getElementById("iosNote").classList.add("show"); }, 450); }
    }
  }
  function move(x,y){
    if(!inHot(x,y)){ lastX=null; lastY=null; return; } // outside the screen → ignore
    if(lastX!=null){
      var dx=x-lastX, dy=y-lastY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      heal( (dist/Math.max(innerWidth,innerHeight)) * SENS );
    }
    lastX=x; lastY=y;
  }
  stage.addEventListener("pointermove",function(e){ move(e.clientX,e.clientY); });
  stage.addEventListener("pointerdown",function(e){ if(inHot(e.clientX,e.clientY)){ lastX=e.clientX; lastY=e.clientY; } });
  stage.addEventListener("pointerleave",function(){ lastX=null; lastY=null; });
  document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key===" "){ heal(0.08); } });

  // notification: close (X) dismisses; tapping body dismisses + draws attention to the question
  var iosNote=document.getElementById("iosNote");
  function dismissNote(){ iosNote.classList.remove("show"); }
  document.getElementById("noteClose").addEventListener("click",function(e){ e.stopPropagation(); dismissNote(); });
  iosNote.addEventListener("click",function(){
    dismissNote();
    var b=document.querySelector(".bottom");
    b.classList.remove("focusq"); void b.offsetWidth; b.classList.add("focusq");
  });

  var toastT;
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},3000);}
  yesBtn.addEventListener("click",function(e){e.stopPropagation(); flipToColour();});
  function flipToColour(){
    dismissNote();
    var veil=document.getElementById("flipVeil");
    document.querySelector(".ui").style.transition="opacity .4s"; document.querySelector(".ui").style.opacity="0";
    // turn the phone/scene edge-on while a light veil rises, then hand off to the colour world
    var s=document.querySelector(".stage");
    s.style.transition="transform .7s cubic-bezier(.6,0,.4,1),opacity .7s ease";
    s.style.transformOrigin="center"; s.style.transform="perspective(1400px) rotateY(-88deg) scale(1.06)"; s.style.opacity="0.4";
    if(veil){ requestAnimationFrame(function(){ veil.style.opacity="1"; }); }
    setTimeout(function(){ location.href="model/"; }, 640);
  }
  document.getElementById("noBtn").addEventListener("click",function(e){e.stopPropagation();toast("這裡會導向「現役機型 + 配件」頁(待接連結)");});
})();
</script>
</body>
</html>
