<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · Choose your iPhone 18</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#1c1b18; --soft:rgba(28,27,24,.6);
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#c3bfb4;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* healed hero photo as the background — same framing as the home page so it flows straight through */
  .stage{position:fixed;inset:0;z-index:0;overflow:hidden}
  #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
  /* soft light scrims top & bottom so the heading and cards stay legible on the beige photo */
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(232,229,222,.72),rgba(232,229,222,.12) 22%,transparent 46%,transparent 60%,rgba(232,229,222,.6))}

  .ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
    padding:clamp(40px,7vh,80px) 24px clamp(30px,6vh,60px)}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.36em;text-transform:uppercase;color:var(--soft);
    opacity:0;animation:fade 1s var(--ease) .1s forwards}
  @keyframes fade{to{opacity:1}}
  .head{text-align:center;margin-top:clamp(16px,3vh,28px);max-width:20ch}
  .head h1{font-weight:600;font-size:clamp(2rem,5vw,3.3rem);line-height:1;letter-spacing:-.03em;text-wrap:balance}
  .head p{margin-top:13px;color:var(--soft);font-size:clamp(.9rem,1.4vw,1.06rem);font-weight:300;max-width:30ch;margin-left:auto;margin-right:auto}

  .grid{margin-top:auto;margin-bottom:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,22px);
    width:min(820px,94vw)}
  /* frosted glass tiles — blur the healed photo behind, echoing the glass theme */
  .card{position:relative;overflow:hidden;pointer-events:auto;cursor:pointer;
    min-height:clamp(118px,20vh,164px);display:grid;place-items:center;text-align:center;
    background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.55);border-radius:24px;
    backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 22px 42px -30px rgba(0,0,0,.5);
    transition:transform .5s var(--spring),border-color .35s,background .35s,box-shadow .45s;
    opacity:0;transform:translateY(18px);animation:cardIn .7s var(--ease) forwards}
  .card::before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 44%)}
  .card:nth-child(1){animation-delay:.14s}
  .card:nth-child(2){animation-delay:.24s}
  .card:nth-child(3){animation-delay:.34s}
  @keyframes cardIn{to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-6px);background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.85);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 30px 50px -26px rgba(0,0,0,.55)}

  .m-name{position:relative;font-weight:500;font-size:clamp(1.1rem,1.7vw,1.45rem);letter-spacing:-.02em;padding:0 12px;color:var(--ink)}

  /* MOBILE (portrait): show the whole healed photo (smaller phone), stack cards */
  @media (max-aspect-ratio:1/1){
    body{background:radial-gradient(78% 60% at 50% 30%,#c3bfb4,#adab9f)}
    #frame{object-fit:contain;transform:translateY(-6vh) scale(1.1);transform-origin:center}
    .scrim{background:linear-gradient(180deg,rgba(232,229,222,.55),transparent 20%,transparent 52%,rgba(232,229,222,.82))}
    .grid{grid-template-columns:1fr;gap:12px;width:min(440px,92vw)}
    .card{min-height:clamp(64px,10vh,80px);border-radius:20px}
    .card::before{border-radius:20px}
  }

  .veil{position:fixed;inset:0;z-index:40;background:#d3cfc6;pointer-events:none;opacity:1;transition:opacity .55s var(--ease)}
  .veil.gone{opacity:0}
</style>
</head>
<body>
  <div class="stage"><img id="frame" alt=""></div>
  <div class="scrim"></div>

  <div class="ui">
    <div class="eyebrow">APIOU &middot; iPhone 18</div>
    <div class="head">
      <h1>Which iPhone 18 is yours?</h1>
      <p>Pick your model to see the colours and cases made for it.</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="veil" id="veil"></div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  // healed hero frame as the backdrop (desktop fills, mobile shows the whole frame)
  var DIR = window.matchMedia("(min-aspect-ratio:1/1)").matches ? "../frames-desktop" : "../frames";
  document.getElementById("frame").src = DIR + "/f_047.jpg";

  var MODELS=[
    {id:"base", nm:"iPhone 18"},
    {id:"air",  nm:"iPhone 18 Air"},
    {id:"pro",  nm:"iPhone 18 Pro"}
  ];
  var gridEl=document.getElementById("grid");
  MODELS.forEach(function(m){
    var c=document.createElement("button"); c.className="card"; c.setAttribute("aria-label",m.nm);
    c.innerHTML='<span class="m-name">'+m.nm+'</span>';
    c.addEventListener("click",function(){ selectModel(m,c); });
    gridEl.appendChild(c);
  });

  var picking=false;
  function selectModel(m,card){
    if(picking)return; picking=true;
    if(!reduce){ card.animate([{transform:"translateY(-6px) scale(1)"},{transform:"translateY(-6px) scale(1.03)"}],{duration:240,easing:"cubic-bezier(.34,1.4,.5,1)",fill:"forwards"}); }
    gridEl.style.transition="opacity .4s var(--ease)"; gridEl.style.opacity=".4";
    var veil=document.getElementById("veil"); veil.classList.remove("gone");
    requestAnimationFrame(function(){ veil.style.opacity="1"; });
    setTimeout(function(){ location.href="../color/?m="+m.id+"#flip"; }, 520);
  }

  // entrance: the (beige) veil from the home flip lifts to reveal the same photo + the choices
  var veil=document.getElementById("veil");
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("gone"); }); });
  setTimeout(function(){ if(veil.parentNode && !picking) veil.parentNode.removeChild(veil); }, 900);
})();
</script>
</body>
</html>
