<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · Choose your iPhone 18</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#f5f4f1; --soft:rgba(245,244,241,.6);
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#0d0e11;overflow:hidden;-webkit-font-smoothing:antialiased}
  canvas#bg{position:fixed;inset:0;z-index:0;display:block}

  .ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
    padding:clamp(44px,8vh,88px) 24px clamp(32px,6vh,64px)}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--soft);
    opacity:0;animation:fade 1s var(--ease) .1s forwards}
  @keyframes fade{to{opacity:1}}
  .head{text-align:center;margin-top:clamp(18px,3vh,30px);max-width:20ch}
  .head h1{font-weight:600;font-size:clamp(2rem,5vw,3.4rem);line-height:1;letter-spacing:-.03em;text-wrap:balance}
  .head p{margin-top:14px;color:var(--soft);font-size:clamp(.92rem,1.4vw,1.08rem);font-weight:300;max-width:30ch;margin-left:auto;margin-right:auto}

  .grid{margin-top:auto;margin-bottom:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,22px);
    width:min(820px,94vw)}
  .card{position:relative;overflow:hidden;pointer-events:auto;cursor:pointer;
    min-height:clamp(120px,20vh,168px);display:grid;place-items:center;text-align:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:24px;
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 20px 40px -30px rgba(0,0,0,.8);
    transition:transform .5s var(--spring),border-color .35s,background .35s,box-shadow .45s;
    opacity:0;transform:translateY(18px);animation:cardIn .7s var(--ease) forwards}
  /* glass sheen */
  .card::before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 42%)}
  .card:nth-child(1){animation-delay:.14s}
  .card:nth-child(2){animation-delay:.24s}
  .card:nth-child(3){animation-delay:.34s}
  @keyframes cardIn{to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-6px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.32);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 30px 50px -28px rgba(0,0,0,.85)}

  .m-name{position:relative;font-weight:500;font-size:clamp(1.1rem,1.7vw,1.45rem);letter-spacing:-.02em;padding:0 12px}

  @media (max-aspect-ratio:1/1){
    .grid{grid-template-columns:1fr;gap:12px;width:min(440px,92vw)}
    .card{min-height:clamp(66px,10vh,82px);border-radius:20px}
    .card::before{border-radius:20px}
  }

  .veil{position:fixed;inset:0;z-index:40;background:#d3cfc6;pointer-events:none;opacity:1;transition:opacity .55s var(--ease)}
  .veil.gone{opacity:0}
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="ui">
    <div class="eyebrow">APIOU &middot; iPhone 18</div>
    <div class="head">
      <h1>Which iPhone 18 is yours?</h1>
      <p>Pick your model to see the colours and cases made for it.</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="veil" id="veil"></div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var MODELS=[
    {id:"base", nm:"iPhone 18"},
    {id:"air",  nm:"iPhone 18 Air"},
    {id:"pro",  nm:"iPhone 18 Pro"}
  ];
  var gridEl=document.getElementById("grid");
  MODELS.forEach(function(m){
    var c=document.createElement("button"); c.className="card"; c.setAttribute("aria-label",m.nm);
    c.innerHTML='<span class="m-name">'+m.nm+'</span>';
    c.addEventListener("click",function(){ selectModel(m,c); });
    gridEl.appendChild(c);
  });

  var picking=false;
  function selectModel(m,card){
    if(picking)return; picking=true;
    if(!reduce){ card.animate([{transform:"translateY(-6px) scale(1)"},{transform:"translateY(-6px) scale(1.03)"}],{duration:240,easing:"cubic-bezier(.34,1.4,.5,1)",fill:"forwards"}); }
    gridEl.style.transition="opacity .4s var(--ease)"; gridEl.style.opacity=".4";
    var veil=document.getElementById("veil"); veil.classList.remove("gone");
    requestAnimationFrame(function(){ veil.style.opacity="1"; });
    setTimeout(function(){ location.href="../color/?m="+m.id+"#flip"; }, 520);
  }

  // entrance: the (beige) veil from the home flip lifts to reveal the studio
  var veil=document.getElementById("veil");
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("gone"); }); });
  setTimeout(function(){ if(veil.parentNode && !picking) veil.parentNode.removeChild(veil); }, 900);

  // ---------- grainy dark studio backdrop with a soft mouse-following bloom ----------
  var cv=document.getElementById("bg"), ctx=cv.getContext("2d"), W,H,dpr=Math.min(2,window.devicePixelRatio||1);
  var grain=null;
  function buildGrain(){var gw=Math.ceil(innerWidth),gh=Math.ceil(innerHeight);var g=document.createElement("canvas");g.width=gw;g.height=gh;var gx=g.getContext("2d");var id=gx.createImageData(gw,gh);var d=id.data;for(var i=0;i<d.length;i+=4){var v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=16;}gx.putImageData(id,0,0);grain=g;}
  function resize(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";buildGrain();}
  resize(); addEventListener("resize",resize);
  var lx=0.5,ly=0.32,tlx=0.5,tly=0.32;
  addEventListener("pointermove",function(e){tlx=0.2+(e.clientX/innerWidth)*0.6;tly=0.12+(e.clientY/innerHeight)*0.45;});
  var base=[13,14,18], bloom=[150,158,174];
  function draw(){
    lx+=(tlx-lx)*.05; ly+=(tly-ly)*.05;
    ctx.fillStyle="rgb("+base[0]+","+base[1]+","+base[2]+")"; ctx.fillRect(0,0,W,H);
    var bx=lx*W,by=ly*H,R=Math.max(W,H)*1.3;
    var g=ctx.createRadialGradient(bx,by,0,bx,by,R);
    g.addColorStop(0,"rgba("+bloom[0]+","+bloom[1]+","+bloom[2]+",.5)");
    g.addColorStop(0.22,"rgba("+((bloom[0]*.7)|0)+","+((bloom[1]*.7)|0)+","+((bloom[2]*.7)|0)+",.2)");
    g.addColorStop(0.5,"rgba("+((bloom[0]*.3)|0)+","+((bloom[1]*.3)|0)+","+((bloom[2]*.3)|0)+",.07)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var fg=ctx.createLinearGradient(0,H*0.78,0,H);
    fg.addColorStop(0,"rgba(0,0,0,0)"); fg.addColorStop(.7,"rgba(255,255,255,.03)"); fg.addColorStop(1,"rgba(0,0,0,.28)");
    ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    if(grain){ ctx.drawImage(grain,0,0,W,H); }
    if(!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw); if(reduce) draw();
})();
</script>
</body>
</html>
