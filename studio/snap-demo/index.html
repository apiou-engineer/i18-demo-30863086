<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · 基礎防護組 · 吸附動畫</title>
<style>
  :root{ --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:#f4f3f0;overflow:hidden;position:relative;
    background:radial-gradient(120% 70% at 50% 20%, #2a2c31 0%, #131417 46%, #0a0a0b 100%)}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 20px}
  .eyebrow{position:absolute;top:clamp(24px,5vh,48px);left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(244,243,240,.55)}

  .stage{position:relative;height:min(62vh,560px);aspect-ratio:499/1000}
  @media (max-aspect-ratio:1/1){ .stage{height:min(46vh,400px)} .eyebrow{top:clamp(16px,3vh,36px)} .wrap{justify-content:flex-start;padding-top:16vh} }
  .stage img{position:absolute;display:block}
  .phone{width:100%;height:100%;object-fit:contain;left:0;top:0;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}
  .ring{--w:80.4%; --x:8.5%; --y:3.8%;
    width:var(--w);left:var(--x);top:var(--y);opacity:0;will-change:transform,opacity}
  .charger{--w:58%; --x:66%; --y:62%;
    width:var(--w);left:var(--x);top:var(--y);opacity:0;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.4));will-change:transform,opacity}

  /* camera-module box shared by the shine layers */
  .cam{position:absolute;left:8.5%;top:3.8%;width:80.4%;aspect-ratio:460/283;pointer-events:none}
  /* bloom = brightness flash over the whole module */
  .bloom{position:absolute;inset:-18%;border-radius:24%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(closest-side, rgba(255,255,255,.9), rgba(255,255,255,.35) 45%, transparent 72%)}
  /* glint = specular streak sweeping across */
  .glint{position:absolute;inset:0;border-radius:20%;overflow:hidden;opacity:0}
  .glint span{position:absolute;top:-40%;height:180%;width:42%;left:-60%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:translateX(-120%) rotate(18deg);filter:blur(2px)}
  /* 4-point star glints */
  .spark{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);opacity:0;
    background:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.95));
    clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}

  .name{margin-top:clamp(18px,4vh,40px);text-align:center}
  .name .t{font-size:clamp(1.3rem,5vw,1.7rem);font-weight:600;letter-spacing:-.02em}
  .name .s{margin-top:6px;font-size:.9rem;color:rgba(244,243,240,.6)}

  .replay{position:absolute;bottom:clamp(28px,6vh,56px);left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,243,240,.7);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:11px 22px;cursor:pointer}
  .replay:active{transform:translateX(-50%) scale(.96)}
</style>
</head>
<body>
  <div class="eyebrow" id="eyebrow">APIOU · 基礎防護組 · 銀白色</div>
  <div class="wrap">
    <div class="stage" id="stage">
      <img class="phone" id="phone" src="../acc/phone-cased-natural.png" alt="iPhone 18 Pro">
      <img class="ring" id="ring" src="../acc/lens-ring-natural.png" alt="鏡頭底座貼">
      <!-- shine layers over the camera module -->
      <div class="cam"><div class="bloom" id="bloom"></div><div class="glint" id="glint"><span></span></div></div>
      <div class="spark" id="s1" style="left:21%;top:9.7%"></div>
      <div class="spark" id="s2" style="left:21%;top:22.4%"></div>
      <div class="spark" id="s3" style="left:44.5%;top:16.1%"></div>
      <img class="charger" id="charger" src="../acc/charger-20w.png" alt="20W 充電頭">
    </div>
    <div class="name">
      <div class="t">基礎防護組</div>
      <div class="s">透明殼 · 鏡頭底座貼 · 20W 充電頭</div>
    </div>
  </div>
  <button class="replay" id="replay">▷ 重播</button>

<script>
(function(){
  // colour-aware: ?c=natural|blue|plum|black
  var COLORS={
    natural:{nm:"銀白色", bg:["#2a2c31","#131417"]},
    blue:{nm:"藍色", bg:["#20304a","#0e1420"]},
    plum:{nm:"梅色", bg:["#33203a","#160e1a"]},
    black:{nm:"黑色", bg:["#3a3d44","#1c1e22"]}
  };
  var cid=new URLSearchParams(location.search).get("c"); if(!COLORS[cid]) cid="natural";
  var C=COLORS[cid];
  document.getElementById("phone").src="../acc/phone-cased-"+cid+".png";
  document.getElementById("ring").src="../acc/lens-ring-"+cid+".png";
  document.getElementById("eyebrow").textContent="APIOU · 基礎防護組 · "+C.nm;
  document.body.style.background="radial-gradient(120% 70% at 50% 20%, "+C.bg[0]+" 0%, "+C.bg[1]+" 48%, #0a0a0b 100%)";

  var ring=document.getElementById("ring"), charger=document.getElementById("charger");
  var glint=document.getElementById("glint"), bar=glint.firstElementChild, bloom=document.getElementById("bloom");
  var sparks=[document.getElementById("s1"),document.getElementById("s2"),document.getElementById("s3")];
  var SPRING="cubic-bezier(.3,1.15,.4,1)", EASE="cubic-bezier(.22,1,.36,1)";

  function play(){
    [ring,charger,glint,bloom].forEach(function(el){el.getAnimations().forEach(function(a){a.cancel();});});
    sparks.forEach(function(s){s.getAnimations().forEach(function(a){a.cancel();}); s.style.opacity=0;});
    glint.style.opacity=0; bloom.style.opacity=0;

    // 1) lens ring descends slowly and snaps on
    ring.animate([
      {opacity:0, transform:"translate(0,-42vh) scale(1.42)"},
      {opacity:1, transform:"translate(0,-42vh) scale(1.42)", offset:.14},
      {opacity:1, transform:"translate(0,14px) scale(.985)", offset:.86},
      {opacity:1, transform:"translate(0,0) scale(1)"}
    ], {duration:1900, delay:550, easing:SPRING, fill:"both"});
    var landAt=550+1900;

    // 2) shine right after it lands: bloom flash + glint sweep + sparkle twinkle
    setTimeout(function(){
      bloom.animate([{opacity:0},{opacity:1,offset:.3},{opacity:0}],{duration:900,easing:EASE,fill:"both"});
      glint.style.opacity=1;
      bar.animate([{transform:"translateX(-120%) rotate(18deg)"},{transform:"translateX(360%) rotate(18deg)"}],
                  {duration:950,easing:EASE,fill:"forwards"});
      setTimeout(function(){ glint.style.opacity=0; }, 900);
      sparks.forEach(function(s,i){
        s.animate([
          {opacity:0, transform:"translate(-50%,-50%) scale(0) rotate(0deg)"},
          {opacity:1, transform:"translate(-50%,-50%) scale(1.15) rotate(45deg)", offset:.45},
          {opacity:0, transform:"translate(-50%,-50%) scale(.2) rotate(90deg)"}
        ], {duration:1100, delay:150+i*180, easing:EASE, fill:"both"});
      });
    }, landAt);

    // 3) charger flies in from the right, settles beside the phone
    charger.animate([
      {opacity:0, transform:"translate(70vw,8vh) rotate(14deg) scale(1.12)"},
      {opacity:1, transform:"translate(70vw,8vh) rotate(14deg) scale(1.12)", offset:.16},
      {opacity:1, transform:"translate(-3%,-1%) rotate(-3deg) scale(1)", offset:.82},
      {opacity:1, transform:"translate(0,0) rotate(0) scale(1)"}
    ], {duration:1500, delay:1700, easing:SPRING, fill:"both"});
  }
  document.getElementById("replay").addEventListener("click",play);
  requestAnimationFrame(function(){ requestAnimationFrame(play); });
})();
</script>
</body>
</html>
