<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APIOU · 你的早鳥組合</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#f4f3f0; --soft:rgba(244,243,240,.6); --line:rgba(244,243,240,.16);
    --card:rgba(24,24,27,.72); --good:#7fd0a0; --hot:#e9b04a;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:#0a0a0b;-webkit-font-smoothing:antialiased;
    min-height:100%;--bgc:#0a0a0b}
  body.light{--ink:#1b1b1e;--soft:rgba(27,27,30,.66);--line:rgba(27,27,30,.14);--card:rgba(255,255,255,.72);--bgc:#d6d2ca}

  /* ---------- HERO (first screen): the phone as the star ---------- */
  .hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(40px,7vh,78px) 24px clamp(24px,4vh,44px)}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--soft)}
  .hero-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative;min-height:0}
  .phone{position:relative;display:inline-block}
  .phone img{height:min(50vh,440px);width:auto;display:block;filter:drop-shadow(0 40px 55px rgba(0,0,0,.5))}
  body.light .phone img{filter:drop-shadow(0 26px 34px rgba(120,116,106,.3))}
  /* accessory layer — reserved for the magnetic snap-on animation (assets pending) */
  .acc-layer{position:absolute;inset:0;pointer-events:none}
  .acc-layer .a-ring{position:absolute;display:block;width:80.4%;height:auto;left:8.5%;top:3.8%;opacity:0;will-change:transform,opacity}
  .acc-layer .a-charger{position:absolute;display:block;width:58%;height:auto;left:66%;top:62%;opacity:0;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)) drop-shadow(0 2px 4px rgba(0,0,0,.4));will-change:transform,opacity}
  .acc-layer .cam{position:absolute;left:8.5%;top:3.8%;width:80.4%;aspect-ratio:460/283}
  .acc-layer .bloom{position:absolute;inset:-18%;border-radius:24%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,.35) 45%,transparent 72%)}
  .acc-layer .glint2{position:absolute;inset:0;border-radius:20%;overflow:hidden;opacity:0}
  .acc-layer .glint2 span{position:absolute;top:-40%;height:180%;width:42%;left:-60%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:translateX(-120%) rotate(18deg);filter:blur(2px)}
  .acc-layer .spk{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);opacity:0;background:#fff;
    filter:drop-shadow(0 0 5px rgba(255,255,255,.95));clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}
  /* generic back-centre magnetic snap (fan / creator bundles) */
  .acc-layer .a-snap{position:absolute;height:auto;opacity:0;will-change:transform,opacity;
    filter:drop-shadow(0 16px 24px rgba(0,0,0,.5)) drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .acc-layer .snap-bloom{position:absolute;aspect-ratio:1;border-radius:50%;opacity:0;mix-blend-mode:screen;pointer-events:none;
    transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,.32) 45%,transparent 72%)}

  .hero-foot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .hero-name{font-size:clamp(1.5rem,5vw,2rem);font-weight:600;letter-spacing:-.02em}
  .hero-save{font-size:.95rem;color:var(--soft)}
  .hero-save b{color:var(--hot);font-weight:600}
  .scrollhint{margin-top:clamp(8px,2vh,18px);font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:5px}
  .scrollhint .arrow{font-size:1rem;animation:bob 1.6s var(--ease) infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}

  /* ---------- DETAILS (scroll down) ---------- */
  .details{max-width:460px;margin:0 auto;padding:clamp(24px,5vh,56px) 20px calc(env(safe-area-inset-bottom,0px) + 60px)}
  .badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--hot);border:1px solid color-mix(in srgb,var(--hot) 55%,transparent);
    border-radius:100px;padding:6px 12px}
  .o-title{font-size:clamp(1.6rem,6vw,2.15rem);font-weight:600;letter-spacing:-.02em;margin:14px 0 4px;line-height:1.05;text-wrap:balance}
  .o-sub{color:var(--soft);font-size:.92rem;margin-bottom:16px}

  .count{display:flex;gap:8px;margin:6px 0 18px}
  .count .u{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 0;flex:1;text-align:center}
  .count .n{font-family:var(--mono);font-size:1.32rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .count .l{font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:5px}
  .count.live .u{flex:0 0 auto;padding:9px 16px;color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .count.live .n{font-size:.82rem;letter-spacing:.1em}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .r-name{font-size:1.18rem;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
  .r-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
  .r-item:first-of-type{padding-top:12px}
  .r-item:last-of-type{border-bottom:none}
  .r-item .d{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}
  .price{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
  .price .was{color:var(--soft);text-decoration:line-through;font-size:.9rem}
  .price .now{font-family:var(--mono);font-size:1.5rem;font-weight:700}
  .price .off{margin-left:auto;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--hot);
    border:1px solid color-mix(in srgb,var(--hot) 55%,transparent);border-radius:100px;padding:4px 10px}
  .placeholder-note{font-family:var(--mono);font-size:.58rem;color:var(--soft);margin-top:8px;letter-spacing:.03em}

  .finish{margin-top:16px}
  .fin-lab{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:9px}
  .fin-row{display:flex;flex-wrap:wrap;gap:8px}
  .fin{font-size:.85rem;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:100px;padding:9px 15px;cursor:pointer;transition:border-color .3s,background .3s}
  .fin.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent);font-weight:500}

  .bonus{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .b-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .b-ic{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot);font-size:.95rem}
  .b-tx{flex:1;min-width:0}
  .b-tx .t{display:block;font-size:.9rem;font-weight:500;line-height:1.25}
  .b-tx .s{display:block;font-size:.75rem;color:var(--soft);margin-top:2px}
  .code{flex:0 0 auto;font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.12em;
    background:var(--ink);color:var(--bgc);border:none;border-radius:8px;padding:8px 12px;cursor:pointer;transition:transform .3s var(--spring)}
  .code:active{transform:scale(.94)}
  .b-link{flex:0 0 auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--soft);text-decoration:none;border:1px solid var(--line);border-radius:100px;padding:7px 12px;transition:color .3s,border-color .3s}

  .actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .btn{display:block;text-align:center;text-decoration:none;appearance:none;border:none;font-family:inherit;
    font-size:1.02rem;font-weight:600;cursor:pointer;padding:16px 24px;border-radius:100px;transition:transform .4s var(--spring)}
  .btn.primary{background:var(--ink);color:var(--bgc);box-shadow:0 14px 34px -16px rgba(0,0,0,.6)}
  .btn.primary:active{transform:scale(.98)}
  .btn.ghost{background:none;color:var(--soft);font-weight:500;font-size:.92rem;padding:8px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:50;
    background:rgba(20,20,20,.92);color:#fff;padding:11px 20px;border-radius:100px;font-size:.86rem;
    opacity:0;transition:opacity .5s var(--ease),transform .5s var(--spring);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .veil{position:fixed;inset:0;z-index:60;background:#0a0a0b;pointer-events:none;opacity:1;transition:opacity .55s var(--ease)}
  .veil.gone{opacity:0}
</style>
</head>
<body>
  <section class="hero">
    <div class="eyebrow" id="eyebrow">APIOU &middot; iPhone 18</div>
    <div class="hero-stage">
      <div class="phone" id="phone">
        <img id="phoneImg" src="../color/titanium-natural.png" alt="iPhone 18">
        <div class="acc-layer" id="accLayer"></div>
      </div>
    </div>
    <div class="hero-foot">
      <div class="hero-name" id="heroName">—</div>
      <div class="hero-save" id="heroSave"></div>
      <div class="scrollhint">往下看組合<span class="arrow">&darr;</span></div>
    </div>
  </section>

  <section class="details">
    <span class="badge">&#9679; 早鳥預購</span>
    <div class="o-title" id="oTitle">你的組合準備好了。</div>
    <div class="o-sub" id="oSub">早鳥預購 9/2 中午 12:00 開跑(台北時間)。</div>

    <div class="count" id="count"></div>

    <div class="card">
      <div class="r-name" id="rName">—</div>
      <div id="rItems"></div>
      <div class="price">
        <span class="was" id="pWas"></span>
        <span class="now" id="pNow"></span>
        <span class="off" id="pOff"></span>
      </div>
      <div class="placeholder-note">實際售價與庫存以商品頁為準。</div>
    </div>

    <div class="finish" id="finish" style="display:none">
      <span class="fin-lab">選擇皮革花色</span>
      <div class="fin-row" id="finRow"></div>
    </div>

    <div class="bonus">
      <div class="b-row">
        <span class="b-ic">&#9670;</span>
        <span class="b-tx"><span class="t">贈同型號鋼化膜</span><span class="s">結帳輸入折扣碼,任一 iPhone 18 殼適用</span></span>
        <button class="code" id="codeBtn" aria-label="複製折扣碼 i18">i18</button>
      </div>
      <div class="b-row">
        <span class="b-ic">&#43;</span>
        <span class="b-tx"><span class="t">加購八合一清潔組</span><span class="s">原價 NT$199 — 加購價 NT$99</span></span>
        <a class="b-link" id="kitLink" target="_blank" rel="noopener">加購</a>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" id="shopBtn" target="_blank" rel="noopener">前往選購 &rarr;</a>
      <button class="btn ghost" id="restartBtn">重新開始</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="veil" id="veil"></div>

<script>
(function(){
  var LINKS={
    set:"https://www.apeelcase.com/categories/set",
    cases:"https://www.apeelcase.com/categories/iphone-18-pro",
    kit:"https://www.apeelcase.com/products/8-in-1-multifunctional-cleaning-kit"
  };
  var PROMO_CODE="i18";
  var OPEN_AT=new Date("2026-09-02T12:00:00+08:00").getTime();

  var MODELS={
    base:{ nm:"iPhone 18", colors:[
      {id:"white", nm:"白色",   img:"../color/titanium-natural.png", base:[228,227,224], neg:true},
      {id:"black", nm:"黑色",   img:"../color/titanium-black.png",   base:[9,9,11]},
      {id:"blue",  nm:"群青色", img:"../color/titanium-blue.png",    base:[10,16,34]},
      {id:"pink",  nm:"粉紅色", img:"../color/titanium-plum.png",    base:[30,14,22]}
    ]},
    air:{ nm:"iPhone 18 Air", colors:[
      {id:"white", nm:"雲白色", img:"../color/titanium-natural.png", base:[224,223,219], neg:true},
      {id:"black", nm:"太空黑", img:"../color/titanium-black.png",   base:[9,9,11]},
      {id:"blue",  nm:"天藍色", img:"../color/titanium-blue.png",    base:[12,20,32]},
      {id:"gold",  nm:"淺金色", img:"../color/titanium-natural.png", base:[222,212,190], neg:true}
    ]},
    pro:{ nm:"iPhone 18 Pro", colors:[
      {id:"natural",nm:"原色鈦金屬", img:"../color/titanium-natural.png", base:[214,210,202], neg:true},
      {id:"black",  nm:"黑色鈦金屬", img:"../color/titanium-black.png",   base:[10,10,11]},
      {id:"plum",   nm:"梅色鈦金屬", img:"../color/titanium-plum.png",    base:[18,10,16]},
      {id:"blue",   nm:"藍色鈦金屬", img:"../color/titanium-blue.png",    base:[9,15,23]}
    ]}
  };
  MODELS.promax={ nm:"iPhone 18 Pro / Pro Max", colors:MODELS.pro.colors };

  var P="https://www.apeelcase.com/products/";
  var BUNDLES={
    minimal:{nm:"新機必備組合", items:["透明殼(非磁吸)","鏡頭底座貼","20W 充電頭"], was:1497, sale:999, url:P+"iphone-18-new-phone-essentials-bundle"},
    creator:{nm:"創作者組合",   items:["液態矽膠殼","指環支架","磁吸吸盤"], was:1797, sale:1199, url:P+"iphone-18-creator-all-in-one-bundle"},
    leather:{nm:"皮革造型組合", items:["皮革手機殼","鏡面支架卡包","皮革掛繩＋墊片"], was:2697, sale:1799, variants:[
      {nm:"侘寂灰", url:P+"iphone-18-wabi-sabi-gray-leather-styling-set"},
      {nm:"奶油灰鱷魚紋", url:P+"iphone-18-beige-crocodile-grain-leather-styling-set"},
      {nm:"黑色荔枝紋", url:P+"iphone-18-black-lychee-grain-leather-styling-set"},
      {nm:"霧面銀",    url:P+"iphone-18-matte-silver-leather-styling-set"}
    ]},
    fan:{nm:"追星必備組合",     items:["鏡面手機殼","旋轉支架卡夾"], was:1598, sale:1199, url:P+"iphone-18-fan-essentials-bundle"},
    home:{nm:"居家快充組合",     items:["透明磁吸殼","四合一無線充","磁吸線","65W 快充"], was:3787, sale:2599, url:P+"iphone-18-all-in-one-home-charging-bundle"}
  };

  var p=new URLSearchParams(location.search);
  var mid=p.get("m"); if(!MODELS[mid]) mid="pro";
  var model=MODELS[mid];
  var col=model.colors.filter(function(c){return c.id===p.get("c");})[0] || model.colors[0];
  var bundle=BUNDLES[p.get("b")] || BUNDLES.minimal;
  var saving=bundle.was-bundle.sale;

  document.getElementById("phoneImg").src=col.img;

  // ---- magnetic snap-on hero animation, per bundle ----
  var bk=p.get("b")||"minimal";
  var cc=col.id, acc=document.getElementById("accLayer"), phoneImg=document.getElementById("phoneImg");
  var haveCol=["natural","plum","blue"].indexOf(cc)>=0;   // colours with bundle art so far (black pending)

  if(bk==="minimal" && (mid==="pro"||mid==="promax") && ["natural","black","plum","blue"].indexOf(cc)>=0){
    phoneImg.src="../acc/phone-cased-"+cc+".png";
    acc.innerHTML='<div class="cam"><div class="bloom"></div><div class="glint2"><span></span></div></div>'
      +'<div class="spk" style="left:21%;top:9.7%"></div><div class="spk" style="left:21%;top:22.4%"></div><div class="spk" style="left:44.5%;top:16.1%"></div>'
      +'<img class="a-ring" src="../acc/lens-ring-'+cc+'.png" alt="">'
      +'<img class="a-charger" src="../acc/charger-20w.png" alt="">';
    setTimeout(playSnap, 900);
  } else if(bk==="fan" && haveCol){
    phoneImg.src="../acc/phone-mirror-"+cc+".png";
    phoneImg.style.height="min(44vh,380px)";   // smaller phone so the clip reads larger
    buildBackSnap([{src:"../acc/fan-clip.png", cx:50, cy:62, w:78, dir:"up", d:0}]);
  } else if(bk==="creator" && haveCol){
    phoneImg.src="../acc/phone-silicone-"+cc+".png";
    phoneImg.style.height="min(44vh,380px)";                              // smaller phone
    document.querySelector(".phone").style.transform="translateX(-34%)";  // shift left so phone+side-ring reads centred
    buildBackSnap([
      {src:"../acc/creator-pad-"+cc+".png",  cx:50,  cy:64, w:(cc==="natural"?60:70), dir:"up", d:0}, // suction pad snaps onto the back (natural reads larger on the cream case → smaller)
      {src:"../acc/creator-ring-"+cc+".png", cx:134, cy:58, w:67, dir:"right", d:600, snap:false} // ring rests beside the phone
    ]);
  } else if(bk==="home" && haveCol){
    phoneImg.src="../acc/home-phone-"+cc+".png";
    phoneImg.style.height="min(44vh,380px)";                              // smaller phone
    document.querySelector(".phone").style.transform="translateX(-30%)";  // shift left so phone+kit reads centred
    buildBackSnap([
      {src:"../acc/home-kit.png", cx:130, cy:56, w:78, dir:"right", d:0, snap:false} // 4-in-1 stand + 65W + cable rests beside
    ]);
  }

  // accessories fly in from off-screen and snap onto the back centre (MagSafe), each with a light flash
  function buildBackSnap(list){
    var html="";
    list.forEach(function(a,i){
      html+='<img class="a-snap" src="'+a.src+'" alt="" style="left:'+a.cx+'%;top:'+a.cy+'%;width:'+a.w+'%">';
      html+='<div class="snap-bloom" style="left:'+a.cx+'%;top:'+a.cy+'%;width:'+(a.w*1.5)+'%"></div>';
    });
    acc.innerHTML=html;
    setTimeout(function(){ playBackSnap(list); }, 900);
  }
  function playBackSnap(list){
    var SP="cubic-bezier(.3,1.15,.4,1)", E="cubic-bezier(.22,1,.36,1)";
    var snaps=acc.querySelectorAll(".a-snap"), blooms=acc.querySelectorAll(".snap-bloom");
    list.forEach(function(a,i){
      var start = a.dir==="down"?"0,46vh" : a.dir==="right"?"54vw,0" : a.dir==="left"?"-54vw,0" : "0,-46vh";
      var over  = a.dir==="down"?"0,-9px" : a.dir==="right"?"-10px,0" : a.dir==="left"?"10px,0" : "0,11px";
      snaps[i].animate([
        {opacity:0, transform:"translate(-50%,-50%) translate("+start+") scale(1.32)"},
        {opacity:1, transform:"translate(-50%,-50%) translate("+start+") scale(1.32)", offset:.14},
        {opacity:1, transform:"translate(-50%,-50%) translate("+over+") scale(.985)", offset:.86},
        {opacity:1, transform:"translate(-50%,-50%) translate(0,0) scale(1)"}
      ],{duration:1700, delay:a.d, easing:SP, fill:"both"});
      if(a.snap!==false)(function(bl){ if(!bl)return;   // flash only when it magnetically attaches
        setTimeout(function(){ bl.animate([{opacity:0},{opacity:1,offset:.3},{opacity:0}],{duration:820,easing:E,fill:"both"}); }, a.d+1520);
      })(blooms[i]);
    });
  }
  function playSnap(){
    var acc=document.getElementById("accLayer");
    var ring=acc.querySelector(".a-ring"), charger=acc.querySelector(".a-charger");
    var glint=acc.querySelector(".glint2"), bar=glint&&glint.firstElementChild, bloom=acc.querySelector(".bloom");
    var sparks=acc.querySelectorAll(".spk");
    var SP="cubic-bezier(.3,1.15,.4,1)", E="cubic-bezier(.22,1,.36,1)";
    ring.animate([{opacity:0,transform:"translate(0,-42vh) scale(1.42)"},{opacity:1,transform:"translate(0,-42vh) scale(1.42)",offset:.14},{opacity:1,transform:"translate(0,14px) scale(.985)",offset:.86},{opacity:1,transform:"translate(0,0) scale(1)"}],{duration:1900,delay:550,easing:SP,fill:"both"});
    setTimeout(function(){
      if(bloom) bloom.animate([{opacity:0},{opacity:1,offset:.3},{opacity:0}],{duration:900,easing:E,fill:"both"});
      if(glint){ glint.style.opacity=1; bar.animate([{transform:"translateX(-120%) rotate(18deg)"},{transform:"translateX(360%) rotate(18deg)"}],{duration:950,easing:E,fill:"forwards"}); setTimeout(function(){glint.style.opacity=0;},900); }
      sparks.forEach(function(s,i){ s.animate([{opacity:0,transform:"translate(-50%,-50%) scale(0) rotate(0)"},{opacity:1,transform:"translate(-50%,-50%) scale(1.15) rotate(45deg)",offset:.45},{opacity:0,transform:"translate(-50%,-50%) scale(.2) rotate(90deg)"}],{duration:1100,delay:150+i*180,easing:E,fill:"both"}); });
    }, 2450);
    charger.animate([{opacity:0,transform:"translate(70vw,8vh) rotate(14deg) scale(1.12)"},{opacity:1,transform:"translate(70vw,8vh) rotate(14deg) scale(1.12)",offset:.16},{opacity:1,transform:"translate(-3%,-1%) rotate(-3deg) scale(1)",offset:.82},{opacity:1,transform:"translate(0,0) rotate(0) scale(1)"}],{duration:1500,delay:1700,easing:SP,fill:"both"});
  }
  document.getElementById("eyebrow").innerHTML="APIOU &middot; "+model.nm;

  // dark studio background for the whole page (keeps the phone dramatic on every colour),
  // subtly tinted toward the chosen colour for cohesion.
  (function(){
    var BG={
      natural:["#2b2d32","#141519"], white:["#2b2d32","#141519"], black:["#34373d","#181a1e"],
      blue:["#1e2c46","#0e1420"], plum:["#301e39","#160e1a"], pink:["#3a2130","#1a0f16"],
      ultramarine:["#1c2450","#0d1024"], gold:["#332b1e","#171410"], _def:["#2a2c31","#131417"]
    };
    var g=BG[col.id]||BG._def;
    document.body.style.background="radial-gradient(120% 62% at 50% 8%, "+g[0]+" 0%, "+g[1]+" 46%, #0a0a0b 100%)";
  })();

  // hero + details fills
  document.getElementById("heroName").textContent=bundle.nm;
  document.getElementById("heroSave").innerHTML="早鳥現省 <b>NT$"+saving+"</b>";
  document.getElementById("rName").textContent=bundle.nm;
  var it=document.getElementById("rItems");
  bundle.items.forEach(function(x){ var d=document.createElement("div");d.className="r-item";
    d.innerHTML='<span class="d"></span><span>'+x+'</span>'; it.appendChild(d); });
  document.getElementById("pWas").textContent="NT$"+bundle.was;
  document.getElementById("pNow").textContent="NT$"+bundle.sale;
  document.getElementById("pOff").textContent=Math.round(bundle.sale/bundle.was*100)+"折";
  document.getElementById("oTitle").textContent="現省 NT$"+saving+"。";
  document.getElementById("kitLink").href=LINKS.kit;

  var shopBtn=document.getElementById("shopBtn");
  if(bundle.variants){
    var finWrap=document.getElementById("finish"), finRow=document.getElementById("finRow");
    finWrap.style.display="";
    shopBtn.href=bundle.variants[0].url;
    bundle.variants.forEach(function(v,i){
      var f=document.createElement("button"); f.className="fin"+(i===0?" on":""); f.textContent=v.nm;
      f.addEventListener("click",function(){
        shopBtn.href=v.url;
        finRow.querySelectorAll(".fin").forEach(function(x){x.classList.remove("on");}); f.classList.add("on");
      });
      finRow.appendChild(f);
    });
  } else { shopBtn.href=bundle.url; }

  document.getElementById("codeBtn").addEventListener("click",function(){
    var done=function(){ toast("已複製折扣碼 "+PROMO_CODE); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(PROMO_CODE).then(done,done); }
    else { done(); }
  });
  var toastT; function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2400);}

  document.getElementById("restartBtn").addEventListener("click",function(){ location.href="../model/"; });

  // countdown
  var countEl=document.getElementById("count"), subEl=document.getElementById("oSub");
  function pad(n){return (n<10?"0":"")+n;}
  function tick(){
    var d=OPEN_AT-Date.now();
    if(d<=0){
      countEl.className="count live";
      countEl.innerHTML='<div class="u"><div class="n">&#9679; 預購進行中</div></div>';
      subEl.textContent="預購進行中 — 活動期間皆適用。";
      return false;
    }
    var s=Math.floor(d/1000), dd=Math.floor(s/86400), hh=Math.floor(s%86400/3600), mm=Math.floor(s%3600/60), ss=s%60;
    countEl.className="count";
    countEl.innerHTML=
      '<div class="u"><div class="n">'+dd+'</div><div class="l">天</div></div>'+
      '<div class="u"><div class="n">'+pad(hh)+'</div><div class="l">時</div></div>'+
      '<div class="u"><div class="n">'+pad(mm)+'</div><div class="l">分</div></div>'+
      '<div class="u"><div class="n">'+pad(ss)+'</div><div class="l">秒</div></div>';
    return true;
  }
  tick(); var ct=setInterval(function(){ if(!tick()) clearInterval(ct); }, 1000);

  // entrance veil (matches the colour) fades out — inline, iOS-safe
  var veil=document.getElementById("veil");
  veil.style.background="#0f1013";
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.style.opacity="0"; }); });
  setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }, 800);
})();
</script>
</body>
</html>
