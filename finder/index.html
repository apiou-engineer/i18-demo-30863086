<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>APIOU &middot; 找到你的那一套</title>
<style>
  :root {
    --bg:#F4F1EC; --surface:#FBFAF7; --surface-2:#EEEAE2;
    --ink:#14130F; --ink-soft:#3B382F; --muted:#7A7568;
    --line:rgba(20,19,15,.10); --line-strong:rgba(20,19,15,.16);
    --beige:#C2BEB5; --stage-a:#EFEBE3; --stage-b:#E2DCD1;
    --shadow-hi:rgba(40,34,22,.14); --good:#4C8A63; --gold:#D9C08A;
    --btn-bg:#14130F; --btn-fg:#F7F5F0;
    --fs-display:clamp(2.4rem,6vw,5rem); --fs-h2:clamp(1.5rem,3vw,2.3rem); --fs-label:.72rem;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --r-lg:26px; --r-md:16px; --r-sm:11px;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#100F0D; --surface:#1A1815; --surface-2:#221F1A;
    --ink:#F3F0E9; --ink-soft:#D8D3C7; --muted:#9E9789;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --stage-a:#1B1916; --stage-b:#0D0C0A; --shadow-hi:rgba(0,0,0,.6);
    --btn-bg:#F3F0E9; --btn-fg:#14130F;
  }}
  :root[data-theme="dark"]{--bg:#100F0D;--surface:#1A1815;--surface-2:#221F1A;--ink:#F3F0E9;--ink-soft:#D8D3C7;--muted:#9E9789;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.18);--stage-a:#1B1916;--stage-b:#0D0C0A;--shadow-hi:rgba(0,0,0,.6);--btn-bg:#F3F0E9;--btn-fg:#14130F;}
  :root[data-theme="light"]{--bg:#F4F1EC;--surface:#FBFAF7;--surface-2:#EEEAE2;--ink:#14130F;--ink-soft:#3B382F;--muted:#7A7568;--line:rgba(20,19,15,.10);--line-strong:rgba(20,19,15,.16);--stage-a:#EFEBE3;--stage-b:#E2DCD1;--shadow-hi:rgba(40,34,22,.14);--btn-bg:#14130F;--btn-fg:#F7F5F0;}

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .eyebrow{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

  .app{min-height:100dvh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:22px;padding:14px clamp(18px,4vw,44px);background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(20px);-webkit-backdrop-filter:saturate(1.4) blur(20px);border-bottom:1px solid var(--line)}
  .wordmark{font-weight:600;font-size:1.02rem;letter-spacing:.42em;padding-left:.42em;flex-shrink:0}
  .rail{display:flex;align-items:center;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail button{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);padding:6px 10px;border-radius:100px;font-size:.82rem;white-space:nowrap;transition:color .35s var(--ease),background .35s var(--ease)}
  .rail .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:.4s var(--spring)}
  .rail button[data-state="done"]{color:var(--ink-soft)} .rail button[data-state="done"] .dot{background:var(--beige)}
  .rail button[data-state="active"]{color:var(--ink);background:var(--surface)} .rail button[data-state="active"] .dot{background:var(--ink);transform:scale(1.5)}
  .rail button:disabled{opacity:.5;cursor:not-allowed}
  .theme-toggle{flex-shrink:0;background:none;border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:.3s}
  .theme-toggle:hover{color:var(--ink);border-color:var(--line-strong)}

  .main{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);min-height:0}
  .stage{position:sticky;top:63px;height:calc(100dvh - 63px);display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(120% 90% at 30% 18%,var(--stage-a),transparent 60%),radial-gradient(120% 120% at 78% 96%,color-mix(in oklab,var(--beige) 34%,var(--stage-b)),var(--stage-b))}
  .stage-inner{position:relative;display:grid;place-items:center;width:100%;height:100%;perspective:1400px}
  .phone-wrap{position:relative;transform-style:preserve-3d;transition:transform 1.1s var(--ease);will-change:transform}
  .caption{position:absolute;left:50%;bottom:clamp(20px,5vh,54px);transform:translateX(-50%);text-align:center;width:max-content;max-width:80%}
  .caption .c-name{font-size:1.35rem;font-weight:500;letter-spacing:-.01em}
  .caption .c-sub{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}

  /* phone (back view) */
  .phone{--w:clamp(210px,23vw,278px);--body:#2A2A2E;--shell:#2A2A2E;position:relative;width:var(--w);height:calc(var(--w)*2.06);border-radius:calc(var(--w)*.165);
    background:linear-gradient(150deg,color-mix(in oklab,var(--body) 78%,#fff 22%),var(--body) 42%,color-mix(in oklab,var(--body) 82%,#000 18%));
    box-shadow:0 2px 3px rgba(0,0,0,.28),0 30px 60px -18px var(--shadow-hi),0 60px 120px -40px var(--shadow-hi),inset 0 0 0 2px rgba(255,255,255,.06);
    transition:background .7s var(--ease),box-shadow .7s var(--ease)}
  .phone::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 30%,rgba(0,0,0,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

  .shell{position:absolute;inset:-8px;border-radius:calc(var(--w)*.19);opacity:0;transform:scale(.985);transition:opacity .55s var(--ease),transform .6s var(--spring),background .6s var(--ease);z-index:1}
  .phone[data-shell="on"] .shell{opacity:1;transform:scale(1)}
  /* materials */
  .shell[data-mat="transparent"]{background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 40%,rgba(255,255,255,.14));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),inset 0 -18px 40px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.2)}
  .shell[data-mat="silicone"]{background:linear-gradient(155deg,color-mix(in oklab,var(--shell) 84%,#fff 16%),var(--shell) 50%,color-mix(in oklab,var(--shell) 86%,#000 14%));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),inset 0 -22px 44px rgba(0,0,0,.20),0 1px 2px rgba(0,0,0,.25)}
  .shell[data-mat="mirror"]{background:linear-gradient(150deg,color-mix(in oklab,var(--shell) 60%,#fff 40%),var(--shell) 46%,color-mix(in oklab,var(--shell) 70%,#000 30%));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 0 -18px 44px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.25);overflow:hidden}
  .shell[data-mat="mirror"]::after{content:"";position:absolute;top:-30%;left:-60%;width:55%;height:160%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:rotate(8deg);animation:sweep 5s var(--ease) infinite}
  @keyframes sweep{0%,100%{left:-60%;opacity:0}18%{opacity:.9}50%{left:120%;opacity:0}}
  .shell[data-mat="leather"]{background:linear-gradient(155deg,#6b5442,#4a3728 45%,#3a2b1f);box-shadow:inset 0 0 0 1.5px rgba(255,220,180,.14),inset 0 -22px 44px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3)}
  .shell[data-mat="leather"]::before{content:"";position:absolute;inset:10px;border-radius:calc(var(--w)*.16);border:1.5px dashed rgba(255,235,205,.22)}

  .camera{position:absolute;top:calc(var(--w)*.055);left:calc(var(--w)*.055);width:calc(var(--w)*.46);height:calc(var(--w)*.46);border-radius:calc(var(--w)*.15);z-index:3;
    background:linear-gradient(150deg,color-mix(in oklab,var(--body) 70%,#fff 30%),color-mix(in oklab,var(--body) 88%,#000 12%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 2px 8px rgba(0,0,0,.3);transition:background .6s var(--ease)}
  .phone[data-shell="on"] .camera{background:linear-gradient(150deg,#2a2a2e,#0c0c0d)}
  .lens{position:absolute;width:34%;height:34%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#4a4a52 0 20%,#17171b 55%,#050506 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.5)}
  .lens.l1{top:12%;left:12%}.lens.l2{bottom:12%;left:12%}.lens.l3{top:30%;right:12%;width:26%;height:26%}
  .magsafe{position:absolute;top:46%;left:50%;width:calc(var(--w)*.42);height:calc(var(--w)*.42);transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(255,255,255,.16);z-index:2;opacity:0;transition:.5s}
  .phone[data-shell="on"] .magsafe{opacity:.55}
  /* card holder (卡包/卡夾) */
  .cardholder{position:absolute;top:52%;left:50%;width:calc(var(--w)*.6);height:calc(var(--w)*.8);transform:translate(-50%,-46%) scale(.9);border-radius:calc(var(--w)*.09);z-index:6;opacity:0;transition:opacity .5s var(--ease),transform .6s var(--spring);
    background:linear-gradient(155deg,color-mix(in oklab,var(--shell) 62%,#fff 38%),color-mix(in oklab,var(--shell) 80%,#000 20%));box-shadow:0 8px 20px -6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.12)}
  .cardholder::before{content:"";position:absolute;top:16%;left:50%;width:60%;height:3px;transform:translateX(-50%);border-radius:3px;background:rgba(0,0,0,.22);box-shadow:0 8px 0 rgba(0,0,0,.14)}
  .phone[data-card="on"] .cardholder{opacity:1;transform:translate(-50%,-46%) scale(1)}
  .glass-sheen{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 34%,transparent 66%,rgba(255,255,255,.08));z-index:5;pointer-events:none}

  /* panel */
  .panel{position:relative;padding:clamp(28px,5vh,60px) clamp(24px,4vw,68px) 120px;display:flex;flex-direction:column;min-height:calc(100dvh - 63px)}
  .step{display:none;flex-direction:column;gap:24px;max-width:480px;margin:auto 0}
  .step.active{display:flex;animation:stepIn .6s var(--ease) both}
  @keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .step-head{display:flex;flex-direction:column;gap:12px}
  .step h1{font-size:var(--fs-display);font-weight:200;letter-spacing:-.04em;line-height:.98;text-wrap:balance}
  .step h2{font-size:var(--fs-h2);font-weight:300;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
  .step p.lede{color:var(--muted);font-size:1.0625rem;max-width:42ch}

  .btn{appearance:none;border:none;background:var(--btn-bg);color:var(--btn-fg);font-size:1rem;font-weight:500;padding:15px 28px;border-radius:100px;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;transition:transform .3s var(--spring),opacity .3s,box-shadow .3s;box-shadow:0 6px 18px -8px var(--shadow-hi)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px var(--shadow-hi)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn .arr{transition:transform .35s var(--spring)} .btn:hover .arr{transform:translateX(4px)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;padding:15px 8px} .btn.ghost:hover{transform:none;opacity:.6}
  .btn:disabled{opacity:.35;pointer-events:none}
  .step-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .swatches{display:flex;gap:14px;flex-wrap:wrap}
  .swatch{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--c);position:relative;transition:transform .35s var(--spring);box-shadow:inset 0 2px 5px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.25)}
  .swatch:hover{transform:scale(1.08)}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink),inset 0 2px 5px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.25)}
  .models{display:flex;flex-wrap:wrap;gap:10px}
  .model{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);padding:10px 16px;border-radius:100px;font-size:.94rem;transition:.3s var(--spring)}
  .model:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .model[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .field-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

  .options{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:flex;align-items:center;gap:14px;transition:border-color .3s,transform .35s var(--spring),background .3s}
  .opt:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .opt .o-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:var(--surface-2);font-size:1.05rem}
  .opt .o-t{font-size:1.05rem;font-weight:500;letter-spacing:-.01em}
  .opt .o-d{font-size:.85rem;color:var(--muted);line-height:1.4}
  .opt .o-tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;color:transparent;transition:.3s;flex-shrink:0}
  .opt[aria-pressed="true"] .o-tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  /* result */
  .result-eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .bundle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:0 20px 50px -30px var(--shadow-hi);display:flex;flex-direction:column;gap:4px}
  .b-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .b-name{font-size:1.4rem;font-weight:500;letter-spacing:-.02em}
  .b-for{font-size:.9rem;color:var(--muted);margin-bottom:14px}
  .b-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.96rem}
  .b-item .bi-dot{width:6px;height:6px;border-radius:50%;background:var(--beige);flex-shrink:0}
  .b-sum{display:flex;flex-direction:column;gap:6px;margin-top:16px}
  .b-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.95rem}
  .b-row .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .b-row.strike .v{text-decoration:line-through;color:var(--muted)}
  .b-row.save{color:var(--good)}
  .b-row.total{font-size:1.5rem;font-weight:500;margin-top:6px;padding-top:12px;border-top:1px solid var(--line-strong)} .b-row.total .v{font-size:1.5rem}
  .price-note{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--muted);margin-top:8px}

  .others{margin-top:6px}
  .others .field-label{margin-bottom:12px}
  .other-chips{display:flex;flex-wrap:wrap;gap:8px}
  .ochip{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);padding:8px 15px;border-radius:100px;font-size:.86rem;transition:.3s var(--spring)}
  .ochip:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .ochip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .ochip.rec{border-color:var(--gold)}

  .toast{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:.9rem;color:var(--muted);display:none}
  .toast.show{display:block;animation:stepIn .5s var(--ease) both}
  .toast strong{color:var(--ink);font-weight:500}

  @media (max-width:900px){
    .main{grid-template-columns:1fr}
    .stage{position:sticky;top:63px;height:42dvh;min-height:300px;z-index:10;border-bottom:1px solid var(--line)}
    .phone{--w:clamp(118px,32vw,164px)}
    .caption{bottom:12px}.caption .c-name{font-size:1.05rem}
    .panel{min-height:auto;padding:30px 22px 100px}
    .step{margin:0;max-width:none}
    .rail button .label{display:none}.rail button{padding:8px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.12s!important}.phone-wrap{transition:none}}
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <div class="wordmark">APIOU</div>
    <nav class="rail" id="rail" aria-label="步驟"></nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切換主題" title="切換主題">&#9680;</button>
  </header>

  <div class="main">
    <section class="stage" aria-label="你的 iPhone">
      <div class="stage-inner">
        <div class="phone-wrap" id="phoneWrap">
          <div class="phone" id="phone" data-shell="off" data-card="off">
            <div class="shell" id="shell" data-mat="transparent"></div>
            <div class="magsafe"></div>
            <div class="cardholder"></div>
            <div class="camera"><div class="lens l1"></div><div class="lens l2"></div><div class="lens l3"></div></div>
            <div class="glass-sheen"></div>
          </div>
        </div>
        <div class="caption" id="caption">
          <div class="c-name" id="capName">你的 iPhone</div>
          <div class="c-sub" id="capSub">先從這裡開始</div>
        </div>
      </div>
    </section>

    <section class="panel" id="panel">
      <!-- 0 hero -->
      <div class="step active" data-step="0">
        <div class="step-head">
          <span class="eyebrow">APIOU 組合精靈</span>
          <h1>為你的 iPhone,<br>找到最對的一套。</h1>
          <p class="lede">回答兩個問題,我們幫你配一套剛剛好的組合——不用比價、不用一件件挑。大約 30 秒。</p>
        </div>
        <button class="btn" data-next>開始 <span class="arr">&rarr;</span></button>
      </div>

      <!-- 1 phone -->
      <div class="step" data-step="1">
        <div class="step-head">
          <span class="eyebrow">第 1 步 &mdash; 你的 iPhone</span>
          <h2>先選你的 iPhone。</h2>
          <p class="lede">機型和顏色,讓我們把組合套在你真正的手機上。</p>
        </div>
        <div>
          <div class="field-label">機型</div>
          <div class="models" id="models"></div>
        </div>
        <div>
          <div class="field-label">顏色</div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="step-actions">
          <button class="btn" data-next disabled id="c1next">繼續 <span class="arr">&rarr;</span></button>
        </div>
      </div>

      <!-- 2 preference -->
      <div class="step" data-step="2">
        <div class="step-head">
          <span class="eyebrow">第 2 步 &mdash; 你的偏好</span>
          <h2>挑手機殼,你最在意哪一點?</h2>
          <p class="lede">選了會即時預覽在你的手機上。</p>
        </div>
        <div class="options" id="prefOptions"></div>
        <div class="step-actions">
          <button class="btn ghost" data-back>返回</button>
          <button class="btn" data-next disabled id="c2next">繼續 <span class="arr">&rarr;</span></button>
        </div>
      </div>

      <!-- 3 use -->
      <div class="step" data-step="3">
        <div class="step-head">
          <span class="eyebrow">第 3 步 &mdash; 使用情境</span>
          <h2>你最常用手機做什麼?</h2>
          <p class="lede">最後一題,幫你把組合抓得更準。</p>
        </div>
        <div class="options" id="useOptions"></div>
        <div class="step-actions">
          <button class="btn ghost" data-back>返回</button>
          <button class="btn" data-next disabled id="c3next">看我的組合 <span class="arr">&rarr;</span></button>
        </div>
      </div>

      <!-- 4 result -->
      <div class="step" data-step="4">
        <div class="step-head">
          <span class="result-eyebrow" id="resEyebrow">為你推薦</span>
          <h2 id="resTitle">你的那一套。</h2>
        </div>
        <div class="bundle" id="bundle"></div>
        <div class="others">
          <div class="field-label">也看看其他組合</div>
          <div class="other-chips" id="otherChips"></div>
        </div>
        <div class="step-actions">
          <button class="btn ghost" data-back>返回</button>
          <button class="btn" id="takeBtn">帶走這一套 <span class="arr">&rarr;</span></button>
        </div>
        <div class="toast" id="toast"></div>
        <button class="btn ghost" data-restart style="margin-top:2px">重新開始</button>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var $=function(s,r){return (r||document).querySelector(s);};

  var MODELS=[
    {id:"17pro",name:"iPhone 17 Pro"},{id:"17",name:"iPhone 17"},
    {id:"air",name:"iPhone Air"},{id:"16",name:"iPhone 16"}
  ];
  var COLORS=[
    {id:"black",name:"曜石黑",body:"#2A2A2E"},
    {id:"silver",name:"銀",body:"#DDDEE1"},
    {id:"blue",name:"天際藍",body:"#8FB2CC"},
    {id:"lavender",name:"薰衣草",body:"#C3B6DD"},
    {id:"mint",name:"薄荷綠",body:"#BAD6C3"}
  ];
  // preference -> material + primary bundle scores
  var PREFS=[
    {id:"feel",  ico:"🤚", t:"好握、親膚的手感", d:"液態矽膠般的觸感",   mat:"silicone",   score:{creator:3}},
    {id:"mirror",ico:"✨",       t:"能照鏡子、自拍反光美", d:"亮面鏡面",       mat:"mirror",     score:{fan:3}},
    {id:"color", ico:"💎", t:"展現 iPhone 原本的顏色", d:"透明、裸機感", mat:"transparent",score:{minimal:3,home:2}},
    {id:"leather",ico:"👜",t:"皮革的質感與高級感", d:"真皮質感",         mat:"leather",    score:{leather:3}},
    {id:"none",  ico:"🙂", t:"其實不太在意,能保護就好", d:"交給下一題決定", mat:"transparent",score:{}}
  ];
  var USES=[
    {id:"photo",   ico:"📸", t:"拍照、拍片、直播",       score:{creator:2}},
    {id:"fan",     ico:"🌟", t:"追星、收集小卡、愛自拍", score:{fan:2}},
    {id:"cards",   ico:"💳", t:"帶卡出門、通勤、講究質感", score:{leather:2}},
    {id:"charging",ico:"⚡",       t:"常充電、多裝置、在家/桌面", score:{home:2}},
    {id:"basic",   ico:"✨",       t:"就是基本、乾淨、夠用",     score:{minimal:2}}
  ];
  var BUNDLES={
    minimal:{name:"裸機主義組",mat:"transparent",card:false,forWho:"剛換新機、只要乾淨基本保護",
      items:["透明殼","鏡頭底座貼","20W 充電頭"],list:990,price:790},
    creator:{name:"創作者組",mat:"silicone",card:false,forWho:"愛拍照、拍片、直播",
      items:["液態矽膠殼","支架/吸盤 2入"],list:1280,price:990},
    leather:{name:"質感皮革組",mat:"leather",card:true,forWho:"講究質感、商務、隨身帶卡",
      items:["皮革殼","卡包","皮革掛繩","墊片"],list:2680,price:1980},
    fan:{name:"追星收藏組",mat:"mirror",card:true,forWho:"追星、愛自拍、收集小卡",
      items:["鏡面手機殼","旋轉卡夾"],list:1180,price:890},
    home:{name:"居家電力組",mat:"transparent",card:false,forWho:"重視充電、多裝置、居家桌面",
      items:["透明殼","四合一無線充","磁吸線","65W 充電頭"],list:2980,price:2280}
  };
  var BUNDLE_ORDER=["minimal","creator","leather","fan","home"];
  var STEP_LABELS=["iPhone","偏好","情境"];

  var state={step:0,model:null,color:null,pref:null,use:null,rec:null,viewing:null};
  var TOTAL=4;
  var phone=$("#phone"), shell=$("#shell"), phoneWrap=$("#phoneWrap");

  // rail
  var rail=$("#rail");
  STEP_LABELS.forEach(function(lab,i){
    var b=document.createElement("button");
    b.innerHTML='<span class="dot"></span><span class="label">'+lab+'</span>';
    b.dataset.goto=String(i+1);
    b.addEventListener("click",function(){if(!b.disabled)goto(parseInt(b.dataset.goto,10));});
    rail.appendChild(b);
  });

  // models
  var mEl=$("#models");
  MODELS.forEach(function(m){
    var b=document.createElement("button");b.className="model";b.textContent=m.name;b.setAttribute("aria-pressed","false");
    b.addEventListener("click",function(){state.model=m;MODELS.forEach(function(x){x._el.setAttribute("aria-pressed",String(x===m));});updateCap();checkStep1();});
    mEl.appendChild(b);m._el=b;
  });
  // colors
  var sEl=$("#swatches");
  COLORS.forEach(function(c){
    var b=document.createElement("button");b.className="swatch";b.style.setProperty("--c",c.body);b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",c.name);b.title=c.name;
    b.addEventListener("click",function(){state.color=c;COLORS.forEach(function(x){x._el.setAttribute("aria-pressed",String(x===c));});phone.style.setProperty("--body",c.body);updateCap();checkStep1();springPhone();});
    sEl.appendChild(b);c._el=b;
  });
  function checkStep1(){$("#c1next").disabled=!(state.model&&state.color);}
  function updateCap(){
    if(state.model||state.color){$("#capName").textContent=(state.model?state.model.name:"iPhone")+(state.color?" · "+state.color.name:"");}
  }

  // preference options
  var pEl=$("#prefOptions");
  PREFS.forEach(function(p){
    var b=document.createElement("button");b.className="opt";b.setAttribute("aria-pressed","false");
    b.innerHTML='<span><span class="o-t">'+p.t+'</span><br><span class="o-d">'+p.d+'</span></span><span class="o-tick">✓</span>';
    b.addEventListener("click",function(){
      state.pref=p;PREFS.forEach(function(x){x._el.setAttribute("aria-pressed",String(x===p));});
      setShell(p.mat);$("#c2next").disabled=false;springPhone();
      $("#capSub").textContent=p.mat==="transparent"?"透明感":p.mat==="silicone"?"矽膠手感":p.mat==="mirror"?"鏡面":"皮革質感";
    });
    pEl.appendChild(b);p._el=b;
  });
  // use options
  var uEl=$("#useOptions");
  USES.forEach(function(u){
    var b=document.createElement("button");b.className="opt";b.setAttribute("aria-pressed","false");
    b.innerHTML='<span class="o-t">'+u.t+'</span><span class="o-tick">✓</span>';
    b.addEventListener("click",function(){state.use=u;USES.forEach(function(x){x._el.setAttribute("aria-pressed",String(x===u));});$("#c3next").disabled=false;});
    uEl.appendChild(b);u._el=b;
  });

  function setShell(mat){
    shell.dataset.mat=mat;
    phone.dataset.shell="on";
    // silicone shell tint = matte version of phone color
    if(mat==="silicone"||mat==="mirror"){shell.style.setProperty("--shell",state.color?state.color.body:"#2A2A2E");}
  }

  // scoring
  function recommend(){
    var sc={minimal:0,creator:0,leather:0,fan:0,home:0};
    function add(o){if(!o)return;for(var k in o)sc[k]=(sc[k]||0)+o[k];}
    if(state.pref)add(state.pref.score);
    if(state.use)add(state.use.score);
    var best="minimal",bestv=-1;
    BUNDLE_ORDER.forEach(function(k){if(sc[k]>bestv){bestv=sc[k];best=k;}});
    return best;
  }

  function renderBundle(key){
    var b=BUNDLES[key];state.viewing=key;
    // phone reflects this bundle
    setShell(b.mat);
    if(b.mat==="transparent"){phone.dataset.shell="on";}
    shell.style.setProperty("--shell",(b.mat==="leather")?"#4a3728":(state.color?state.color.body:"#2A2A2E"));
    phone.dataset.card=b.card?"on":"off";
    $("#capName").textContent=b.name;
    $("#capSub").textContent=(state.model?state.model.name:"")+(state.color?" · "+state.color.name:"");
    // card
    var el=$("#bundle");
    var save=b.list-b.price;
    var items=b.items.map(function(it){return '<div class="b-item"><span class="bi-dot"></span><span>'+it+'</span></div>';}).join("");
    el.innerHTML=
      '<div class="b-top"><span class="b-name">'+b.name+'</span></div>'+
      '<div class="b-for">'+b.forWho+'</div>'+
      items+
      '<div class="b-sum">'+
      '<div class="b-row strike"><span>單買加總</span><span class="v">$'+b.list+'</span></div>'+
      '<div class="b-row save"><span>組合省下</span><span class="v">− $'+save+'</span></div>'+
      '<div class="b-row total"><span>組合價</span><span class="v">$'+b.price+'</span></div>'+
      '</div>'+
      '<div class="price-note">價格為示意,實際以商品頁為準</div>';
    // other chips
    var chips=$("#otherChips");chips.innerHTML="";
    BUNDLE_ORDER.forEach(function(k){
      var bb=BUNDLES[k];var c=document.createElement("button");c.className="ochip"+(k===state.rec?" rec":"");
      c.textContent=bb.name+(k===state.rec?" · 推薦":"");
      c.setAttribute("aria-pressed",String(k===key));
      c.addEventListener("click",function(){renderBundle(k);springPhone();});
      chips.appendChild(c);
    });
    springPhone();
  }

  // navigation
  function goto(n){
    n=Math.max(0,Math.min(TOTAL,n));
    if(n>=2&&!(state.model&&state.color))n=1;
    if(n>=3&&!state.pref)n=2;
    if(n>=4&&!state.use)n=3;
    state.step=n;
    document.querySelectorAll(".step").forEach(function(s){s.classList.toggle("active",parseInt(s.dataset.step,10)===n);});
    updateRail();onEnter(n);
    if(window.innerWidth<=900)window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
    else $("#panel").scrollTo({top:0,behavior:"auto"});
  }
  function onEnter(n){
    if(n===0){phone.dataset.shell="off";phone.dataset.card="off";$("#capName").textContent="你的 iPhone";$("#capSub").textContent="先從這裡開始";}
    if(n===1){if(state.pref)setShell(state.pref.mat);}
    if(n===2){if(state.pref)setShell(state.pref.mat);}
    if(n===4){state.rec=recommend();renderBundle(state.rec);$("#resEyebrow").textContent="最適合你的是";$("#resTitle").textContent=BUNDLES[state.rec].name;}
  }
  function updateRail(){
    rail.querySelectorAll("button").forEach(function(b,i){
      var no=i+1,st="todo";
      if(no<state.step)st="done";if(no===state.step)st="active";
      b.dataset.state=st;
      b.disabled=(no>=2&&!(state.model&&state.color))||(no>=3&&!state.pref)||(no>=4&&!state.use);
    });
  }

  function springPhone(){if(reduce)return;phoneWrap.animate([{transform:"scale(1)"},{transform:"scale(1.035)"},{transform:"scale(1)"}],{duration:520,easing:"cubic-bezier(.34,1.56,.64,1)"});}

  // pointer parallax
  if(!reduce&&window.matchMedia("(pointer:fine)").matches){
    var stage=$(".stage");
    stage.addEventListener("pointermove",function(e){var r=stage.getBoundingClientRect();var x=(e.clientX-r.left)/r.width-.5;var y=(e.clientY-r.top)/r.height-.5;phoneWrap.style.transform="rotateY("+(x*12)+"deg) rotateX("+(-y*12)+"deg)";});
    stage.addEventListener("pointerleave",function(){phoneWrap.style.transform="rotateY(0) rotateX(0)";});
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-next],[data-back],[data-restart]");if(!t)return;
    if(t.hasAttribute("data-next"))goto(state.step+1);
    else if(t.hasAttribute("data-back"))goto(state.step-1);
    else if(t.hasAttribute("data-restart"))restart();
  });
  $("#takeBtn").addEventListener("click",function(){
    var b=BUNDLES[state.viewing||state.rec];
    var note=$("#toast");
    note.innerHTML="準備帶走 <strong>"+b.name+"</strong>($"+b.price+")。正式版這裡會連到「"+b.name+"」的商品頁面。";
    note.classList.add("show");
  });

  function restart(){
    state={step:0,model:null,color:null,pref:null,use:null,rec:null,viewing:null};
    MODELS.forEach(function(m){m._el.setAttribute("aria-pressed","false");});
    COLORS.forEach(function(c){c._el.setAttribute("aria-pressed","false");});
    PREFS.forEach(function(p){p._el.setAttribute("aria-pressed","false");});
    USES.forEach(function(u){u._el.setAttribute("aria-pressed","false");});
    $("#c1next").disabled=true;$("#c2next").disabled=true;$("#c3next").disabled=true;
    phone.style.setProperty("--body","#2A2A2E");phone.dataset.shell="off";phone.dataset.card="off";shell.dataset.mat="transparent";
    $("#toast").classList.remove("show");
    goto(0);
  }

  // theme
  var root=document.documentElement;
  $("#themeToggle").addEventListener("click",function(){var cur=root.getAttribute("data-theme");var sysDark=window.matchMedia("(prefers-color-scheme:dark)").matches;root.setAttribute("data-theme",cur?(cur==="dark"?"light":"dark"):(sysDark?"light":"dark"));});

  updateRail();
})();
</script>

</body>
</html>
